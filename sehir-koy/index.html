<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Şehir Kurucu</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --o1:#ffb24a; --o2:#e8741a; --brown:#4b2a14; --brown2:#6b3d1d; --cream:#fff3d9; --ink:#fff; --green:#5fd04a; --red:#e8503a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #5cc2ee; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; z-index: 5; }
  .txt { text-shadow: 0 2px 0 #000a, 0 0 4px #0008; letter-spacing: .5px; }
  /* üst çubuk */
  #lvl { top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); display: flex; align-items: center; }
  #star { width: 62px; height: 62px; position: relative; z-index: 2; filter: drop-shadow(0 2px 2px #0008); }
  #star b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #3a2200; padding-top: 3px; }
  .bar { position: relative; height: 32px; border-radius: 16px; background: #2c1d12; border: 3px solid var(--o2); overflow: hidden; min-width: 96px; box-shadow: 0 2px 4px #0006; }
  .bar .f { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffc766, #e8741a); }
  .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .bar.full .f { width: 100% !important; }
  #lvl .bar { margin-left: -16px; padding-left: 14px; min-width: 100px; }
  #cash { top: max(8px, env(safe-area-inset-top)); left: calc(max(6px, env(safe-area-inset-left)) + 150px); display: flex; gap: 8px; align-items: center; }
  #cash .grp { display: flex; align-items: center; position: relative; }
  #cash .ico { width: 40px; height: 40px; margin-right: -14px; z-index: 2; filter: drop-shadow(0 2px 2px #0008); }
  #cash .bar { min-width: 140px; padding-left: 14px; }
  .plus { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(#7ee05a, #2fa22a); border: 3px solid var(--o2); margin-left: -8px; z-index: 2; color: #fff; font: inherit; font-size: 1.3rem; line-height: 1; padding: 0; cursor: pointer; text-shadow: 0 2px 0 #0007; }
  #stats { top: max(8px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); display: grid; gap: 6px; justify-items: end; }
  #stats .grp { display: flex; align-items: center; position: relative; }
  #stats .ico { width: 38px; height: 38px; margin-right: -14px; z-index: 2; filter: drop-shadow(0 2px 2px #0008); }
  #stats .bar { min-width: 128px; height: 28px; padding-left: 14px; }
  #stats .bar span { font-size: .95rem; }
  #chest { position: fixed; top: max(8px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 150px); width: 64px; height: 64px; }
  .btn3 { border: 3px solid var(--o2); border-radius: 16px; background: linear-gradient(#7a4a26, #3d2210); color: #fff; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 3px 0 #2a1608, 0 6px 8px #0006; padding: 0; position: relative; }
  .btn3:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a1608; }
  .btn3 svg { width: 60%; height: 60%; } .btn3 small { font-size: .62rem; line-height: 1; opacity: .95; }
  .btn3.on { background: linear-gradient(#ffcf70, #e8741a); }
  .badge { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 2px solid #fff; font-size: .8rem; display: none; align-items: center; justify-content: center; }
  .badge.show { display: flex; }
  #left { top: 84px; left: max(6px, env(safe-area-inset-left)); display: grid; gap: 10px; }
  #left .btn3 { width: 56px; height: 56px; }
  #bottom { bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  #bottom .btn3 { width: 66px; height: 66px; }
  #hint { bottom: 86px; left: 50%; transform: translateX(-50%); background: #000b; border: 2px solid var(--o2); padding: 8px 16px; border-radius: 14px; display: none; text-align: center; max-width: 92vw; }
  #pbar { bottom: 86px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; }
  #pbar button { height: 54px; padding: 0 18px; border-radius: 14px; font: inherit; font-size: 1.1rem; color: #fff; border: 3px solid #fff; cursor: pointer; text-shadow: 0 2px 0 #0007; }
  #pbar .ok { background: linear-gradient(#7ee05a, #2fa22a); } #pbar .no { background: linear-gradient(#ff7a62, #c4301a); }
  #shop { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: linear-gradient(#5a3216f2, #2e1a0cf8); border-top: 4px solid var(--o2); border-radius: 22px 22px 0 0; padding: 10px 10px max(10px, env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .25s ease; }
  #shop.open { transform: none; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px; }
  #tabs button { flex: 0 0 auto; padding: 7px 16px; border-radius: 12px; border: 2px solid var(--o2); background: #3d2210; color: #fff; font: inherit; cursor: pointer; }
  #tabs button.on { background: linear-gradient(#ffcf70, #e8741a); color: #3a2200; }
  #cards { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; touch-action: pan-x; }
  .card { flex: 0 0 132px; background: linear-gradient(#fff3d9, #f0d9a8); color: #3a2200; border: 3px solid var(--o2); border-radius: 14px; padding: 6px; text-align: center; cursor: pointer; position: relative; }
  .card canvas { width: 100%; height: 84px; display: block; }
  .card b { display: block; font-weight: normal; font-size: .95rem; line-height: 1.1; }
  .card small { display: block; font-size: .72rem; color: #6b3d1d; line-height: 1.25; }
  .card .pr { display: inline-flex; align-items: center; gap: 4px; background: #2c1d12; color: #ffd45a; border-radius: 10px; padding: 1px 9px; margin-top: 3px; font-size: .9rem; }
  .card.lock { filter: grayscale(.9) brightness(.8); } .card.poor .pr { color: #ff8c7a; }
  .card .lk { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000a; color: #fff; border-radius: 10px; font-size: 1.05rem; }
  .card.lock .lk { display: flex; }
  #xshop { position: absolute; top: -18px; right: 14px; width: 36px; height: 36px; border-radius: 50%; background: var(--red); border: 3px solid #fff; color: #fff; font: inherit; cursor: pointer; }
  #modal { position: fixed; inset: 0; z-index: 30; background: #0009; display: flex; align-items: center; justify-content: center; padding: 14px; }
  #modal[hidden], #sea[hidden] { display: none; }
  .box { background: linear-gradient(#fff3d9, #f5dfb0); color: #3a2200; border: 4px solid var(--o2); border-radius: 20px; padding: 16px; width: min(500px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 8px 30px #000a; font-family: system-ui, "Trebuchet MS", sans-serif; }
  .box h3 { margin: 0 0 6px; font: inherit; font-size: 1.5rem; color: #b5500e; }
  .box p { margin: 0 0 8px; } .hint { color: #6b4a2a; font-size: .86rem; line-height: 1.4; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #d3b57c; flex-wrap: wrap; }
  .row .info { flex: 1 1 170px; min-width: 0; } .row .info b { display: block; } .row .info small { color: #6b4a2a; }
  .b { font: inherit; font-family: "Lilita One", sans-serif; font-size: 1rem; background: linear-gradient(#7ee05a, #2fa22a); color: #fff; border: 3px solid #fff; border-radius: 12px; padding: 6px 14px; cursor: pointer; text-shadow: 0 2px 0 #0006; box-shadow: 0 2px 0 #1b6a18; }
  .b:disabled { background: #b9ad98; box-shadow: none; cursor: not-allowed; text-shadow: none; color: #eee; }
  .b.red { background: linear-gradient(#ff7a62, #c4301a); box-shadow: 0 2px 0 #7a1a0c; } .b.blue { background: linear-gradient(#6ec3ff, #2477c9); box-shadow: 0 2px 0 #134a85; }
  .b.gh { background: transparent; color: #6b3d1d; border-color: #c9a566; box-shadow: none; text-shadow: none; }
  .cost { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; }
  .cost.no { color: #c4301a; }
  .meter { height: 9px; border-radius: 9px; background: #00000030; overflow: hidden; margin-top: 4px; } .meter i { display: block; height: 100%; background: #e0452e; } .meter.go i { background: #e8741a; }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: #e5cf9f; } .tag.win { background: #aee59a; color: #1d5a12; } .tag.lose { background: #ffb7a8; color: #7a1a0c; }
  .log div { background: #fff8e6; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: .88rem; border-left: 4px solid #c9a566; } .log div.bad { border-color: #e0452e; } .log div.good { border-color: #3aa82a; }
  .num { display: flex; align-items: center; gap: 6px; } .num input { width: 62px; border: 2px solid #c9a566; border-radius: 8px; padding: 5px; font: inherit; text-align: center; background: #fff; color: #3a2200; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: 78px; z-index: 40; display: grid; gap: 6px; width: min(420px, calc(100vw - 24px)); pointer-events: none; }
  .toast { background: #000c; border: 2px solid var(--o1); border-radius: 12px; padding: 8px 12px; font-size: .95rem; text-align: center; animation: up .3s ease; } .toast.bad { border-color: var(--red); } .toast.good { border-color: var(--green); }
  @keyframes up { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  #sea { position: fixed; inset: 0; z-index: 20; background: #1d6f9c; }
  #sea canvas { width: 100%; height: 100%; display: block; }
  #seaTop { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 max(10px, env(safe-area-inset-right)); align-items: center; pointer-events: none; }
  #seaTop > * { pointer-events: auto; } #seaTop h2 { margin: 0; font-size: 1.6rem; }
  #intro { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: linear-gradient(#5cc2eecc, #1d6f9ccc); padding: 18px; text-align: center; }
  #intro h1 { margin: 0 0 4px; font-size: 2.6rem; color: #ffd45a; text-shadow: 0 3px 0 #8a3d0a; }
  @media (max-width: 720px) { #star { width: 50px; height: 50px; } #lvl .bar { min-width: 70px; height: 26px; } #cash { left: calc(max(6px, env(safe-area-inset-left)) + 118px); top: 6px; gap: 4px; flex-direction: column; align-items: flex-start; } #cash .bar { min-width: 112px; height: 28px; } #cash .ico { width: 34px; height: 34px; } #stats .bar { min-width: 96px; height: 24px; } #stats .bar span { font-size: .8rem; } #stats .ico { width: 30px; height: 30px; } #chest { display: none; } #left { top: 120px; } #bottom { gap: 5px; } #bottom .btn3 { width: 54px; height: 58px; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="lvl" class="hud txt"><svg id="star" viewBox="0 0 64 64"><polygon points="32,3 40,23 61,24 45,38 50,59 32,47 14,59 19,38 3,24 24,23" fill="#ffc83a" stroke="#8a4b0b" stroke-width="4" stroke-linejoin="round"/></svg><b id="lvn" style="position:absolute;left:0;top:0;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#3a2200;z-index:3;padding-top:3px;text-shadow:none">1</b><div class="bar"><div class="f" id="xpf"></div><span id="xpt">0%</span></div></div>
<div id="cash" class="hud txt">
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#ffd34a" stroke="#9a5a0a" stroke-width="3"/><circle cx="20" cy="20" r="11" fill="none" stroke="#e0a21a" stroke-width="2.5"/><path d="M20 12v16M16 16h6.5a3 3 0 010 6H16" stroke="#b5700a" stroke-width="2.6" fill="none"/></svg><div class="bar full"><div class="f"></div><span id="coins">0</span></div><button class="plus" data-act="collect">+</button></div>
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><polygon points="20,4 34,14 28,36 12,36 6,14" fill="#7fd6ff" stroke="#27608c" stroke-width="3" stroke-linejoin="round"/><polygon points="20,4 34,14 20,16 6,14" fill="#c8f0ff"/></svg><div class="bar full" style="--x:0"><div class="f" style="background:linear-gradient(#6ec3ff,#2477c9)"></div><span id="gems">0</span></div><button class="plus" data-act="gemshop">+</button></div>
</div>
<button id="chest" class="hud btn3 txt" data-act="chest"><svg viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="22" rx="4" fill="#7a4a26" stroke="#2a1608" stroke-width="3"/><path d="M6 24h36" stroke="#e8c04a" stroke-width="4"/><rect x="20" y="22" width="8" height="9" rx="2" fill="#ffd34a" stroke="#2a1608" stroke-width="2"/><path d="M8 18c0-8 6-12 16-12s16 4 16 12" fill="#8c5a30" stroke="#2a1608" stroke-width="3"/></svg><small id="chestT">Sandık</small><i class="badge" id="chestB">!</i></button>
<div id="stats" class="hud txt">
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#ffd34a" stroke="#9a5a0a" stroke-width="3"/><circle cx="14" cy="16" r="2.5" fill="#4a2a0a"/><circle cx="26" cy="16" r="2.5" fill="#4a2a0a"/><path d="M11 24c3 8 15 8 18 0" stroke="#4a2a0a" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div class="bar"><div class="f" id="hapf"></div><span id="hapt">100%</span></div></div>
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><circle cx="14" cy="13" r="6" fill="#f5c9a0" stroke="#5a3a1a" stroke-width="2.4"/><circle cx="27" cy="15" r="5.2" fill="#f5c9a0" stroke="#5a3a1a" stroke-width="2.4"/><path d="M3 34c0-9 6-12 11-12s11 3 11 12zM22 34c0-6 3-9 6-9s9 3 9 9z" fill="#e8741a" stroke="#5a3a1a" stroke-width="2.4"/></svg><div class="bar"><div class="f" id="popf"></div><span id="popt">0/0</span></div></div>
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><rect x="5" y="14" width="30" height="21" rx="4" fill="#6b4a2a" stroke="#2a1608" stroke-width="2.6"/><path d="M14 14v-4a3 3 0 013-3h6a3 3 0 013 3v4" fill="none" stroke="#2a1608" stroke-width="2.6"/><rect x="17" y="20" width="6" height="6" fill="#ffd34a" stroke="#2a1608" stroke-width="1.6"/></svg><div class="bar"><div class="f" id="jobf"></div><span id="jobt">0/0</span></div></div>
  <div class="grp"><svg class="ico" viewBox="0 0 40 40"><path d="M20 4l13 5v11c0 9-6 15-13 17C13 35 7 29 7 20V9z" fill="#4a7bd6" stroke="#1d2f66" stroke-width="2.6"/><path d="M13 22l7-12 7 12z" fill="#e8f0ff"/></svg><div class="bar"><div class="f" id="armf" style="background:linear-gradient(#7fb0ff,#2f5fc0)"></div><span id="armt">0/0</span></div></div>
</div>
<div id="left" class="hud txt">
  <button class="btn3" data-act="quests"><svg viewBox="0 0 48 48"><rect x="10" y="6" width="28" height="36" rx="4" fill="#fff3d9" stroke="#2a1608" stroke-width="3"/><path d="M16 16h16M16 24h16M16 32h10" stroke="#b5500e" stroke-width="3" stroke-linecap="round"/></svg><small>Görevler</small><i class="badge" id="qB">!</i></button>
  <button class="btn3" data-act="log"><svg viewBox="0 0 48 48"><path d="M10 8h24l6 6v26H10z" fill="#fff3d9" stroke="#2a1608" stroke-width="3" stroke-linejoin="round"/><path d="M16 20h16M16 28h16M16 35h10" stroke="#6b3d1d" stroke-width="3" stroke-linecap="round"/></svg><small>Rapor</small><i class="badge" id="lB">!</i></button>
  <button class="btn3" data-speed="1" id="spd"><svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="16" fill="#fff3d9" stroke="#2a1608" stroke-width="3"/><path d="M24 26V15M24 26l8 5" stroke="#b5500e" stroke-width="3.5" stroke-linecap="round"/><rect x="20" y="4" width="8" height="5" fill="#2a1608"/></svg><small id="spdT">Hız ×1</small></button>
</div>
<div id="bottom" class="hud txt">
  <button class="btn3" data-act="shop"><svg viewBox="0 0 48 48"><path d="M4 8h7l6 22h22l5-16H14" fill="#6ed06a" stroke="#1d5a1a" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="38" r="4" fill="#fff" stroke="#1d5a1a" stroke-width="2.5"/><circle cx="35" cy="38" r="4" fill="#fff" stroke="#1d5a1a" stroke-width="2.5"/></svg><small>Mağaza</small></button>
  <button class="btn3" data-act="road" id="roadB"><svg viewBox="0 0 48 48"><path d="M16 4h16l10 40H6z" fill="#6b7078" stroke="#1c1f24" stroke-width="3" stroke-linejoin="round"/><path d="M24 8v6M24 20v6M24 32v8" stroke="#ffd34a" stroke-width="3" stroke-linecap="round"/></svg><small>Yol</small></button>
  <button class="btn3" data-act="dozer" id="dozB"><svg viewBox="0 0 48 48"><rect x="6" y="22" width="26" height="12" rx="3" fill="#ffd34a" stroke="#6a4a00" stroke-width="3"/><rect x="18" y="10" width="14" height="14" fill="#ffd34a" stroke="#6a4a00" stroke-width="3"/><path d="M34 14v24h6l2-6V20z" fill="#b8bec5" stroke="#444" stroke-width="2.5"/><circle cx="12" cy="38" r="5" fill="#333"/><circle cx="26" cy="38" r="5" fill="#333"/></svg><small>Buldozer</small></button>
  <button class="btn3" data-act="collect"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="#ffd34a" stroke="#8a4b0b" stroke-width="3"/><path d="M24 14v20M19 19h8a4 4 0 010 8h-9" stroke="#b5700a" stroke-width="3" fill="none" stroke-linecap="round"/></svg><small>Topla</small><i class="badge" id="colB">!</i></button>
  <button class="btn3" data-act="army"><svg viewBox="0 0 48 48"><path d="M24 4l16 6v12c0 11-7 18-16 22C15 40 8 33 8 22V10z" fill="#4a7bd6" stroke="#1d2f66" stroke-width="3"/><path d="M16 30l16-16M32 30L16 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg><small>Ordu</small></button>
  <button class="btn3" data-act="sea"><svg viewBox="0 0 48 48"><path d="M6 30h36l-6 10H12z" fill="#8c5a30" stroke="#2a1608" stroke-width="3" stroke-linejoin="round"/><path d="M24 6v24" stroke="#2a1608" stroke-width="3"/><path d="M26 8l14 18H26z" fill="#fff" stroke="#2a1608" stroke-width="2.5" stroke-linejoin="round"/></svg><small>Seferler</small><i class="badge" id="seaB">!</i></button>
</div>
<div id="hint" class="hud txt"></div>
<div id="pbar" class="hud"><button class="no" data-act="pcancel">✕ Vazgeç</button><button class="ok" data-act="pok">✓ Yerleştir</button></div>
<div id="shop"><button id="xshop" data-act="closeshop">✕</button><div id="tabs"></div><div id="cards"></div></div>
<div id="sea" hidden><canvas id="seac"></canvas><div id="seaTop" class="txt"><h2>Deniz Haritası</h2><button class="b red" data-act="closesea">Şehre dön</button></div></div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<div id="intro"><div class="box" style="text-align:center"><h1>ŞEHİR KURUCU</h1><p class="hint">Yollar çek, ev ve iş yerleri kur, vatandaşları mutlu et. Kışla ve limanla ordu kurup komşu adalara çıkartma yap.</p><p class="hint">Sürükle: kaydır · Tekerlek / iki parmak: yakınlaştır · Altaki Mağaza'dan bina seç</p><button class="b" id="go" style="font-size:1.4rem;padding:8px 30px">Oyna</button></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const TW = 96, TH = 48, N = 26, TAU = Math.PI * 2, OUT = 'rgba(40,20,5,.55)';
const fmt = n => Math.floor(n).toLocaleString('tr-TR');
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const pick = (arr, id) => arr[Math.floor(hash(id, 7) * arr.length)];

// ================= TANIMLAR =================
// w,d: arsa; h: yaklaşık yükseklik (px); pop: nüfus; jobs: iş; inc: saniyelik gelir; hap: mutluluk
const BD = {
  house:    { n: 'Küçük Ev',   cat: 'Konut', w: 1, d: 1, h: 46, cost: 300,   lv: 1, pop: 8,   inc: 0, info: 'Nüfus +8' },
  villa:    { n: 'Villa',      cat: 'Konut', w: 2, d: 2, h: 58, cost: 1800,  lv: 3, pop: 24,  info: 'Nüfus +24' },

function soldierIcon(c, x, y, team, s, dead) { c.save(); c.translate(x, y); if (dead) c.rotate(Math.PI / 2); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 2, 6, 2.5, 0, 0, TAU); c.fill(); c.fillStyle = team === 'blue' ? '#2f6bd6' : '#c0392b'; c.fillRect(-3.5, -11, 7, 10); c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(0, -14, 3.6, 0, TAU); c.fill(); c.fillStyle = '#c9ced6'; c.fillRect(-4, -18, 8, 3); c.strokeStyle = '#e8ecef'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(5, -8); c.lineTo(9, -16); c.stroke(); c.restore(); }
