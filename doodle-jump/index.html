<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kozmik Kedi</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0820; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: 100vh; max-height: 800px; aspect-ratio: 2 / 3; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 14px; box-shadow: 0 0 40px #7b3fe488; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b0820d9; text-align: center; color: #d9d2ff; border-radius: 14px; gap: 10px; padding: 0 24px; }
  .overlay h1 { margin: 0; font-size: 2.8rem; letter-spacing: 2px; color: #ffd166; text-shadow: 0 0 18px #ff9f1c; }
  .overlay p { margin: 0; }
  .overlay b { color: #6ef3d6; }
  .overlay button { font-size: 1.3rem; padding: 10px 30px; border: 2px solid #6ef3d6; border-radius: 6px; background: transparent;
    color: #6ef3d6; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 0 14px #6ef3d655; }
  .overlay button:hover { background: #6ef3d622; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="600"></canvas>
  <div id="menu" class="overlay">
    <h1>KOZMİK KEDİ</h1>
    <p>Astronot kedi yıldız taşlarından<br>zıplayarak yükseliyor.<br>← → veya A / D · mobilde ekranın sol/sağına dokun</p>
    <p>Rekor: <b id="best">0</b></p>
    <button id="start">Fırlat</button>
  </div>
  <div id="over" class="overlay hidden">
    <h1>Boşluğa Düştün</h1>
    <p>Yükseklik: <b id="final">0</b></p>
    <p>Rekor: <b id="best2">0</b></p>
    <button id="again">Yeniden Fırlat</button>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const $ = id => document.getElementById(id);
let best = +localStorage.getItem('zz-best') || 0;
$('best').textContent = best;

const GRAVITY = 0.38, JUMP = -11.5, SPRING_JUMP = -19, SPEED = 5;
let lastType = 'normal', player, platforms, items, enemies, score, camY, running, keys = {}, touchDir = 0, frame;

function newPlatform(y, type) {
  if (!type) {
    const r = Math.random(), d = Math.min(score / 8000, 0.4);
    type = score < 600 ? 'normal' : r < 0.1 + d * 0.3 ? 'moving' : r < 0.18 + d * 0.4 ? 'break' : 'normal';
    // Kırılan platformdan sonra mutlaka sağlam platform gelsin
    if (type === 'break' && lastType === 'break') type = 'normal';
    lastType = type;
  }
  const p = { x: Math.random() * (W - 70), y, w: 70, h: 14, type, dx: 1 + Math.random() * 1.5 + score / 8000, broken: false };
  if (type === 'normal' && Math.random() < 0.08) items.push({ kind: 'spring', plat: p, ox: 20 });
  else if (type === 'normal' && Math.random() < 0.02) items.push({ kind: 'jet', plat: p, ox: 22 });
  return p;
}

function reset() {
  score = 0; camY = 0; frame = 0; lastType = 'normal';
  platforms = []; items = []; enemies = [];
  player = { x: W / 2 - 20, y: H - 120, w: 40, h: 40, vx: 0, vy: JUMP, dir: 1, jet: 0 };
  platforms.push({ x: W / 2 - 50, y: H - 60, w: 100, h: 14, type: 'normal', dx: 0, broken: false });
  for (let y = H - 120; y > -H; y -= gap()) platforms.push(newPlatform(y));
}

function gap() { return 50 + Math.min(score / 250, 30) + Math.random() * 20; }

function update() {
  frame++;
  const dir = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0) || touchDir;
  player.vx = dir * SPEED;
  if (dir) player.dir = dir;
  player.x += player.vx;
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;

  if (player.jet > 0) { player.vy = -14; player.jet--; } else player.vy += GRAVITY;
  const prevBottom = player.y + player.h;
  player.y += player.vy;

  // Platform çarpışması
  if (player.vy > 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (prevBottom <= p.y + 4 && player.y + player.h >= p.y &&
          player.x + player.w - 8 > p.x && player.x + 8 < p.x + p.w) {
        if (p.type === 'break') { p.broken = true; continue; }
        player.vy = JUMP;
        for (const it of items) if (it.plat === p) {
          if (it.kind === 'spring') player.vy = SPRING_JUMP;
          if (it.kind === 'jet') { player.jet = 90; items.splice(items.indexOf(it), 1); }
          break;
        }
        break;
      }
    }
  }

  // Hareketli platformlar
  for (const p of platforms) if (p.type === 'moving') {
    p.x += p.dx; if (p.x < 0 || p.x + p.w > W) p.dx *= -1;
  }
  for (const p of platforms) if (p.broken) p.y += 6;

  // Düşmanlar
  for (const e of enemies) {
    e.x += e.dx; if (e.x < 0 || e.x + e.w > W) e.dx *= -1;
    if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 2 && player.y + player.h < e.y + e.h * 0.6) { // üstüne zıpla
        e.dead = true; player.vy = JUMP; score += 200;
      } else if (player.jet <= 0) return gameOver();
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // Kamera
  if (player.y < H * 0.4) {
    const d = H * 0.4 - player.y;
    player.y = H * 0.4; camY += d; score += Math.round(d);
    platforms.forEach(p => p.y += d); enemies.forEach(e => e.y += d);
  }

  // Yeni platform üret / eskileri sil
  platforms = platforms.filter(p => p.y < H + 60);
  items = items.filter(it => platforms.includes(it.plat));
  enemies = enemies.filter(e => e.y < H + 60);
  let top = Math.min(...platforms.map(p => p.y));
  while (top > -60) {
    top -= gap();
    platforms.push(newPlatform(top));
    if (score > 1500 && Math.random() < 0.06 && enemies.length < 2)
      enemies.push({ x: Math.random() * (W - 40), y: top - 50, w: 40, h: 30, dx: 1.2 + Math.random() });
  }

  if (player.y > H) gameOver();
}

function gameOver() {
  running = false;
  if (score > best) { best = score; localStorage.setItem('zz-best', best); }
  $('final').textContent = score; $('best2').textContent = best;
  $('over').classList.remove('hidden');
}

const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, z: Math.random() * 0.5 + 0.1 }));

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0820'); g.addColorStop(0.6, '#241250'); g.addColorStop(1, '#4a1d6e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const st of stars) { // paralaks yıldızlar
    const y = (st.y + camY * st.z) % H;
    ctx.fillStyle = `rgba(255,255,255,${0.4 + st.z})`; ctx.fillRect(st.x, y, st.r, st.r);
  }
  // uzak gezegen
  const py = (140 + camY * 0.08) % (H + 200) - 60;
  ctx.fillStyle = '#ff9f1c22'; ctx.beginPath(); ctx.arc(320, py, 46, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffd16655'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(320, py, 70, 14, -0.4, 0, 7); ctx.stroke();

  for (const p of platforms) { // yıldız taşları
    const col = p.type === 'moving' ? ['#38bdf8', '#0b6fa4'] : p.type === 'break' ? ['#c4b5a0', '#6b5b4b'] : ['#6ef3d6', '#14907a'];
    ctx.shadowColor = col[0]; ctx.shadowBlur = p.type === 'break' ? 0 : 10;
    ctx.fillStyle = col[1]; ctx.beginPath(); ctx.roundRect(p.x, p.y + 4, p.w, p.h - 4, 7); ctx.fill();
    ctx.fillStyle = col[0]; ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 8, 5); ctx.fill();
    ctx.shadowBlur = 0;
    if (p.type === 'break') { ctx.strokeStyle = '#2a1f17'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x + 28, p.y); ctx.lineTo(p.x + 36, p.y + 7); ctx.lineTo(p.x + 31, p.y + p.h); ctx.stroke(); }
  }
  for (const it of items) {
    const x = it.plat.x + it.ox, y = it.plat.y;
    if (it.kind === 'spring') { // mantar sıçratıcı
      ctx.fillStyle = '#f5e6c8'; ctx.fillRect(x + 3, y - 10, 8, 10);
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(x + 7, y - 10, 12, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x, y - 16, 4, 4); ctx.fillRect(x + 9, y - 19, 4, 4);
    } else { // roket
      ctx.fillStyle = '#e8e8f5'; ctx.beginPath(); ctx.roundRect(x, y - 26, 16, 24, [8, 8, 2, 2]); ctx.fill();
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x - 5, y); ctx.lineTo(x + 3, y - 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 16, y - 8); ctx.lineTo(x + 21, y); ctx.lineTo(x + 13, y - 2); ctx.fill();
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(x + 8, y - 17, 4, 0, 7); ctx.fill();
    }
  }
  for (const e of enemies) { // UFO
    ctx.fillStyle = '#7dd3fc'; ctx.beginPath(); ctx.arc(e.x + 20, e.y + 10, 11, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#a3a3c2'; ctx.beginPath(); ctx.ellipse(e.x + 20, e.y + 16, 20, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = Math.floor(frame / 8) % 2 ? '#ffd166' : '#ff4d6d';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(e.x + 8 + i * 12, e.y + 17, 2.5, 0, 7); ctx.fill(); }
  }
  drawPlayer();

  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 20px "Trebuchet MS", system-ui'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(score + ' m', 14, 30);
  if (best) { ctx.fillStyle = '#d9d2ff88'; ctx.font = '13px system-ui'; ctx.fillText('rekor ' + best, 14, 48); }
}

function drawPlayer() {
  const { x, y, w, h, dir } = player;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(dir, 1);
  const squash = player.vy < -2 ? 1.08 : 0.96; ctx.scale(1 / squash, squash);
  if (player.jet > 0) { ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(-14, 8); ctx.lineTo(-8, 36 + Math.random() * 12); ctx.lineTo(0, 12); ctx.lineTo(8, 36 + Math.random() * 12); ctx.lineTo(14, 8); ctx.fill(); }
  ctx.fillStyle = '#e8e8f5'; ctx.beginPath(); ctx.roundRect(-13, 4, 26, 16, 6); ctx.fill();         // tulum
  ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(0, -4, 17, 0, 7); ctx.fill();                  // kafa
  ctx.beginPath(); ctx.moveTo(-15, -12); ctx.lineTo(-13, -26); ctx.lineTo(-4, -17); ctx.fill();       // kulaklar
  ctx.beginPath(); ctx.moveTo(15, -12); ctx.lineTo(13, -26); ctx.lineTo(4, -17); ctx.fill();
  ctx.fillStyle = '#7dd3fc55'; ctx.strokeStyle = '#e8e8f5'; ctx.lineWidth = 3;                         // kask
  ctx.beginPath(); ctx.arc(0, -4, 20, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1b1035'; ctx.beginPath(); ctx.ellipse(-6, -5, 2.5, 4, 0, 0, 7); ctx.ellipse(7, -5, 2.5, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff6b8b'; ctx.fillRect(0, 0, 3, 2);                                                  // burun
  ctx.strokeStyle = '#1b1035'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, 1); ctx.lineTo(18, -1); ctx.moveTo(8, 4); ctx.lineTo(18, 5); ctx.stroke();
  ctx.fillStyle = '#ffb347'; ctx.fillRect(-12, 18, 8, 6); ctx.fillRect(4, 18, 8, 6);                    // patiler
  ctx.restore();
}

function loop() {
  if (!running) return;
  update(); draw();
  if (running) requestAnimationFrame(loop);
}

function start() {
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  reset(); running = true; requestAnimationFrame(loop);
}

addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });
function touch(e) {
  if (!running) return;
  e.preventDefault();
  if (!e.touches.length) { touchDir = 0; return; }
  const r = cv.getBoundingClientRect();
  touchDir = e.touches[0].clientX - r.left < r.width / 2 ? -1 : 1;
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, touch, { passive: false }));
$('start').onclick = start; $('again').onclick = start;
reset(); draw();
</script>
</body>
</html>
