<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kozmik Kedi</title>
<style>
  html, body { margin: 0; height: 100%; background: #070516; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: 100vh; max-height: 800px; aspect-ratio: 2 / 3; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 18px; box-shadow: 0 0 60px #7b3fe466, 0 0 0 1px #ffffff14; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #2a1560cc, #070516ee); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-align: center; color: #d9d2ff; border-radius: 18px; gap: 12px; padding: 0 24px; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  .overlay h1 { margin: 0; font-size: 2.9rem; letter-spacing: 3px; background: linear-gradient(90deg, #ffd166, #ff7eb6, #6ef3d6);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px #ff7eb655); }
  .overlay p { margin: 0; line-height: 1.5; }
  .overlay b { color: #6ef3d6; font-size: 1.2em; }
  .overlay button { margin-top: 8px; font-size: 1.15rem; padding: 12px 34px; border: 0; border-radius: 999px; cursor: pointer; letter-spacing: 2px;
    text-transform: uppercase; color: #0b0820; font-weight: bold; background: linear-gradient(135deg, #6ef3d6, #8ab4ff);
    box-shadow: 0 6px 24px #6ef3d655; transition: transform .15s ease, box-shadow .15s ease; }
  .overlay button:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 30px #6ef3d688; }
  .overlay button:active { transform: scale(.97); }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="menu" class="overlay">
    <h1>KOZMİK KEDİ</h1>
    <p>Astronot kedi yıldız taşlarından<br>zıplayarak yükseliyor.<br>← → veya A / D · mobilde ekranın sol/sağına dokun</p>
    <p>Rekor: <b id="best">0</b></p>
    <button id="start">Fırlat</button>
  </div>
  <div id="over" class="overlay hidden">
    <h1>Boşluğa Düştün</h1>
    <p>Yükseklik: <b id="final">0</b> m</p>
    <p>Rekor: <b id="best2">0</b> m</p>
    <button id="again">Yeniden Fırlat</button>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 400, H = 600;           // mantıksal çözünürlük
const $ = id => document.getElementById(id);
let best = 0; try { best = +localStorage.getItem('zz-best') || 0; } catch (e) {}
$('best').textContent = best;

// Keskin görüntü: ekranın gerçek piksel yoğunluğuna göre çiz
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

const GRAVITY = 0.38, JUMP = -11.5, SPRING_JUMP = -19, SPEED = 5;
let lastType = 'normal', player, platforms, items, enemies, particles, trail, score, camY, running = false, keys = {}, touchDir = 0, frame = 0, shake = 0, last = 0;

function newPlatform(y, type) {
  if (!type) {
    const r = Math.random(), d = Math.min(score / 8000, 0.4);
    type = score < 600 ? 'normal' : r < 0.1 + d * 0.3 ? 'moving' : r < 0.18 + d * 0.4 ? 'break' : 'normal';
    if (type === 'break' && lastType === 'break') type = 'normal';
    lastType = type;
  }
  const p = { x: Math.random() * (W - 70), y, w: 70, h: 14, type, dx: 1 + Math.random() * 1.5 + score / 8000, broken: false, sq: 0 };
  if (type === 'normal' && Math.random() < 0.08) items.push({ kind: 'spring', plat: p, ox: 20, sq: 0 });
  else if (type === 'normal' && Math.random() < 0.02) items.push({ kind: 'jet', plat: p, ox: 22, sq: 0 });
  return p;
}
function gap() { return 50 + Math.min(score / 250, 30) + Math.random() * 20; }

function reset() {
  score = 0; camY = 0; frame = 0; lastType = 'normal'; shake = 0;
  platforms = []; items = []; enemies = []; particles = []; trail = [];
  player = { x: W / 2 - 20, y: H - 120, w: 40, h: 40, vx: 0, vy: JUMP, dir: 1, jet: 0, sy: 1, tilt: 0 };
  platforms.push({ x: W / 2 - 50, y: H - 60, w: 100, h: 14, type: 'normal', dx: 0, broken: false, sq: 0 });
  for (let y = H - 120; y > -H; y -= gap()) platforms.push(newPlatform(y));
}

// ---- Parçacıklar ----
function burst(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2);
    const s = (o.speed ?? 3) * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: (o.life ?? 30) * (0.6 + Math.random() * 0.6),
      r: (o.r ?? 3) * (0.6 + Math.random() * 0.8), color: o.color ?? '255,255,255', g: o.g ?? 0.05, add: o.add ?? false });
  }
}

function bounceFx(p, big) {
  p.sq = 1;
  burst(player.x + player.w / 2, p.y, big ? 18 : 9, { angle: -Math.PI / 2, spread: Math.PI * 0.9, speed: big ? 4 : 2.4, life: 26, r: 2.5, color: '140,255,230', add: true });
}

function update(k) {
  frame += k;
  const dir = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0) || touchDir;
  // yumuşak ivmelenme
  player.vx += (dir * SPEED - player.vx) * Math.min(1, 0.28 * k);
  if (dir) player.dir = dir;
  player.x += player.vx * k;
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;
  player.tilt += (player.vx * 0.045 - player.tilt) * Math.min(1, 0.2 * k);

  if (player.jet > 0) {
    player.vy = -14; player.jet -= k;
    burst(player.x + player.w / 2 - player.dir * 4, player.y + player.h - 4, 2, { angle: Math.PI / 2, spread: 0.5, speed: 4, life: 22, r: 4, color: '255,170,60', add: true, g: 0 });
  } else player.vy += GRAVITY * k;
  const prevBottom = player.y + player.h;
  player.y += player.vy * k;

  // squash & stretch
  const targetSy = 1 + Math.max(-0.12, Math.min(0.2, -player.vy * 0.014));
  player.sy += (targetSy - player.sy) * Math.min(1, 0.25 * k);

  // iz
  if (player.jet > 0 || player.vy < -15) trail.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, a: 1 });
  for (const t of trail) t.a -= 0.07 * k;
  trail = trail.filter(t => t.a > 0);

  if (player.vy > 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (prevBottom <= p.y + 4 + player.vy * k * 0.5 && player.y + player.h >= p.y &&
          player.x + player.w - 8 > p.x && player.x + 8 < p.x + p.w) {
        if (p.type === 'break') {
          p.broken = true; p.vy = 0;
          burst(p.x + p.w / 2, p.y + 6, 14, { spread: Math.PI * 2, speed: 2.5, life: 34, r: 3, color: '196,181,160', g: 0.15 });
          continue;
        }
        player.vy = JUMP;
        let big = false;
        for (const it of items) if (it.plat === p) {
          if (it.kind === 'spring') { player.vy = SPRING_JUMP; it.sq = 1; big = true; }
          if (it.kind === 'jet') { player.jet = 90; items.splice(items.indexOf(it), 1); big = true; }
          break;
        }
        bounceFx(p, big);
        break;
      }
    }
  }

  for (const p of platforms) {
    if (p.type === 'moving') { p.x += p.dx * k; if (p.x < 0 || p.x + p.w > W) p.dx *= -1; }
    if (p.broken) { p.vy = (p.vy || 0) + 0.35 * k; p.y += p.vy * k; }
    p.sq = Math.max(0, p.sq - 0.07 * k);
  }
  for (const it of items) it.sq = Math.max(0, it.sq - 0.06 * k);

  for (const e of enemies) {
    e.x += e.dx * k; if (e.x < 0 || e.x + e.w > W) e.dx *= -1;
    if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 2 && player.y + player.h < e.y + e.h * 0.6) {
        e.dead = true; player.vy = JUMP; score += 200; shake = 6;
        burst(e.x + e.w / 2, e.y + e.h / 2, 26, { speed: 4.5, life: 36, r: 3, color: '255,209,102', add: true, g: 0.08 });
      } else if (player.jet <= 0) return gameOver();
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // kamera
  if (player.y < H * 0.4) {
    const d = H * 0.4 - player.y;
    player.y = H * 0.4; camY += d; score += Math.round(d);
    platforms.forEach(p => p.y += d); enemies.forEach(e => e.y += d);
    particles.forEach(q => q.y += d); trail.forEach(t => t.y += d);
  }

  platforms = platforms.filter(p => p.y < H + 60);
  items = items.filter(it => platforms.includes(it.plat));
  enemies = enemies.filter(e => e.y < H + 60);
  let top = Math.min(...platforms.map(p => p.y));
  while (top > -60) {
    top -= gap();
    platforms.push(newPlatform(top));
    if (score > 1500 && Math.random() < 0.06 && enemies.length < 2)
      enemies.push({ x: Math.random() * (W - 40), y: top - 50, w: 40, h: 30, dx: 1.2 + Math.random() });
  }

  for (const q of particles) { q.life += k; q.x += q.vx * k; q.y += q.vy * k; q.vy += q.g * k; }
  particles = particles.filter(q => q.life < q.max);
  shake = Math.max(0, shake - 0.5 * k);

  if (player.y > H) gameOver();
}

function gameOver() {
  running = false;
  if (score > best) { best = score; try { localStorage.setItem('zz-best', best); } catch (e) {} }
  $('final').textContent = score; $('best2').textContent = best;
  $('over').classList.remove('hidden');
}

// ---- Çizim ----
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.4, z: Math.random() * 0.6 + 0.08, ph: Math.random() * 6 }));
const TAU = Math.PI * 2;

function nebula(x, y, r, c) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},0.28)`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070516'); g.addColorStop(0.55, '#1c0f46'); g.addColorStop(1, '#4a1d6e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const o = camY * 0.05;
  nebula(90, (200 + o) % (H + 300) - 100, 190, '120,70,255');
  nebula(330, (460 + o * 1.4) % (H + 300) - 100, 170, '255,90,170');
  nebula(200, (20 + o * 0.8) % (H + 300) - 100, 150, '60,200,230');
  const t = frame * 0.03;
  for (const st of stars) {
    const y = (st.y + camY * st.z) % H;
    const a = 0.35 + st.z * 0.6 + Math.sin(t + st.ph) * 0.2;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0.1, a)})`;
    ctx.beginPath(); ctx.arc(st.x, y, st.r, 0, TAU); ctx.fill();
  }
  // gezegen
  const py = (140 + camY * 0.08) % (H + 240) - 80, px = 320;
  const pg = ctx.createRadialGradient(px - 14, py - 14, 4, px, py, 48);
  pg.addColorStop(0, '#ffd9a0'); pg.addColorStop(0.6, '#e8845a'); pg.addColorStop(1, '#5a2a63');
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, 46, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,170,0.55)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(px, py, 74, 15, -0.4, Math.PI, TAU); ctx.stroke();
  ctx.restore();
}

function drawPlatform(p) {
  const pal = p.type === 'moving' ? ['#7fd8ff', '#2a8fd0', '#12507f'] : p.type === 'break' ? ['#d8cbb8', '#9a8a76', '#5b4d3e'] : ['#9bffe8', '#33d1ae', '#0f7a66'];
  const sq = p.sq * 4, y = p.y + sq, h = p.h - sq;
  ctx.save();
  if (p.type !== 'break') { ctx.shadowColor = pal[1]; ctx.shadowBlur = 14; }
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, pal[0]); g.addColorStop(0.45, pal[1]); g.addColorStop(1, pal[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(p.x, y, p.w, h, h / 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.roundRect(p.x + 6, y + 2, p.w - 12, 2.5, 2); ctx.fill();
  if (p.type === 'break') {
    ctx.strokeStyle = 'rgba(40,28,20,0.8)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p.x + 26, y); ctx.lineTo(p.x + 33, y + h * 0.5); ctx.lineTo(p.x + 28, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x + 48, y + 1); ctx.lineTo(p.x + 43, y + h * 0.6); ctx.stroke();
  }
  if (p.type === 'moving') {
    ctx.fillStyle = 'rgba(200,245,255,0.9)';
    for (const sx of [p.x + 8, p.x + p.w - 8]) { ctx.beginPath(); ctx.arc(sx, y + h / 2 + 1, 2, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}

function drawItem(it) {
  const x = it.plat.x + it.ox, y = it.plat.y;
  ctx.save();
  if (it.kind === 'spring') { // mantar
    const s = 1 - it.sq * 0.35;
    ctx.translate(x + 7, y); ctx.scale(1 + it.sq * 0.25, s);
    ctx.fillStyle = '#f7ecd6'; ctx.beginPath(); ctx.roundRect(-4, -11, 8, 11, 3); ctx.fill();
    const g = ctx.createRadialGradient(-4, -17, 2, 0, -11, 15);
    g.addColorStop(0, '#ff93a8'); g.addColorStop(1, '#e0264f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -11, 14, 11, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-6, -15, 2.4, 0, TAU); ctx.arc(4, -18, 2, 0, TAU); ctx.arc(8, -13, 1.6, 0, TAU); ctx.fill();
  } else { // roket
    ctx.translate(x + 8, y);
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
    const g = ctx.createLinearGradient(-8, 0, 8, 0); g.addColorStop(0, '#c9cbe6'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#b0b3d6');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(10, -18, 8, -3); ctx.lineTo(-8, -3); ctx.quadraticCurveTo(-10, -18, 0, -30); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ff4d6d';
    ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(-14, 0); ctx.lineTo(-6, -3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(14, 0); ctx.lineTo(6, -3); ctx.fill();
    ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(0, -17, 3.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  const bob = Math.sin(frame * 0.12 + e.x * 0.05) * 3;
  ctx.save(); ctx.translate(e.x + 20, e.y + 14 + bob); ctx.rotate(Math.sin(frame * 0.08) * 0.08);
  ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 16;
  const dome = ctx.createRadialGradient(-4, -10, 2, 0, -4, 14); dome.addColorStop(0, '#e0f6ff'); dome.addColorStop(1, '#4fb0e8');
  ctx.fillStyle = dome; ctx.beginPath(); ctx.arc(0, -3, 12, Math.PI, 0); ctx.fill();
  ctx.shadowBlur = 0;
  const body = ctx.createLinearGradient(0, 0, 0, 12); body.addColorStop(0, '#d5d7f0'); body.addColorStop(1, '#6a6d9a');
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 3, 21, 8, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = (Math.floor(frame / 8) + i) % 3 === 0 ? '#ffd166' : '#ff4d6d';
    ctx.beginPath(); ctx.arc(-11 + i * 11, 5, 2.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPlayer() {
  const { x, y, w, h, dir } = player;
  // iz (hayalet kediler)
  for (const t of trail) {
    ctx.fillStyle = `rgba(255,190,110,${t.a * 0.35})`; ctx.beginPath(); ctx.arc(t.x, t.y, 15 * t.a + 3, 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(player.tilt); ctx.scale(dir / player.sy * 0.9 + 0.1 * dir, player.sy);
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8;
  // kuyruk
  ctx.strokeStyle = '#ff9d3a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 14); ctx.quadraticCurveTo(-26, 12 + Math.sin(frame * 0.2) * 4, -22, -2); ctx.stroke();
  ctx.shadowBlur = 0;
  // tulum
  const sg = ctx.createLinearGradient(0, 2, 0, 22); sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#b9bbdc');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.roundRect(-14, 3, 28, 18, 8); ctx.fill();
  ctx.fillStyle = '#6ef3d6'; ctx.beginPath(); ctx.arc(0, 12, 3, 0, TAU); ctx.fill();
  // patiler
  ctx.fillStyle = '#ff9d3a'; ctx.beginPath(); ctx.ellipse(-8, 22, 5.5, 4, 0, 0, TAU); ctx.ellipse(8, 22, 5.5, 4, 0, 0, TAU); ctx.fill();
  // kafa
  const hg = ctx.createRadialGradient(-5, -12, 3, 0, -4, 20); hg.addColorStop(0, '#ffcf8c'); hg.addColorStop(1, '#f5902f');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(-14, -27); ctx.lineTo(-3, -18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16, -12); ctx.lineTo(14, -27); ctx.lineTo(3, -18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.moveTo(-13, -16); ctx.lineTo(-12.5, -23); ctx.lineTo(-7, -18); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -16); ctx.lineTo(12.5, -23); ctx.lineTo(7, -18); ctx.fill();
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, -4, 17, 0, TAU); ctx.fill();
  // gözler
  ctx.fillStyle = '#1b1035'; ctx.beginPath(); ctx.ellipse(-6, -5, 2.8, 4.4, 0, 0, TAU); ctx.ellipse(7, -5, 2.8, 4.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5.2, -6.6, 1.1, 0, TAU); ctx.arc(7.8, -6.6, 1.1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff6b8b'; ctx.beginPath(); ctx.moveTo(-1.8, 0); ctx.lineTo(1.8, 0); ctx.lineTo(0, 2.2); ctx.fill();
  ctx.strokeStyle = 'rgba(27,16,53,0.7)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(8, 2); ctx.lineTo(18, 0); ctx.moveTo(8, 4.5); ctx.lineTo(18, 6); ctx.moveTo(-8, 2); ctx.lineTo(-18, 0); ctx.moveTo(-8, 4.5); ctx.lineTo(-18, 6); ctx.stroke();
  // kask
  const gl = ctx.createLinearGradient(-18, -22, 18, 14); gl.addColorStop(0, 'rgba(160,225,255,0.45)'); gl.addColorStop(1, 'rgba(160,225,255,0.08)');
  ctx.fillStyle = gl; ctx.strokeStyle = 'rgba(240,248,255,0.95)'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, -4, 21, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -4, 16, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    const a = 1 - q.life / q.max;
    ctx.globalCompositeOperation = q.add ? 'lighter' : 'source-over';
    ctx.fillStyle = `rgba(${q.color},${a * (q.add ? 0.8 : 1)})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(0.2, q.r * (0.4 + a * 0.6)), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(20,12,50,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(12, 12, 110, 38, 19); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 20px "Trebuchet MS", system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText(score + ' m', 26, 31);
  if (best) { ctx.fillStyle = 'rgba(217,210,255,0.6)'; ctx.font = '12px system-ui'; ctx.textAlign = 'right'; ctx.fillText('rekor ' + best, W - 14, 24); }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  platforms.forEach(drawPlatform);
  items.forEach(drawItem);
  enemies.forEach(drawEnemy);
  drawPlayer();
  drawParticles();
  ctx.restore();
  drawHUD();
}

function loop(t) {
  if (!running) return;
  const k = Math.max(0, Math.min((t - last) / 16.667, 2.5)); last = t;
  update(k); draw();
  if (running) requestAnimationFrame(loop);
}

function start() {
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  reset(); running = true; last = performance.now(); requestAnimationFrame(loop);
}

addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });
function touch(e) {
  if (!running) return;
  e.preventDefault();
  if (!e.touches.length) { touchDir = 0; return; }
  const r = cv.getBoundingClientRect();
  touchDir = e.touches[0].clientX - r.left < r.width / 2 ? -1 : 1;
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, touch, { passive: false }));
$('start').onclick = start; $('again').onclick = start;
reset(); draw();
</script>
</body>
</html>
