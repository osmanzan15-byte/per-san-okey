<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köy Kurucu</title>
<style>
  :root { color-scheme: dark;
    --bg:#16201b; --panel:#1f2c25; --panel2:#283a30; --line:#38503f; --ink:#e9efe3; --mute:#9fb3a3; --gold:#f0c24b; --accent:#e9a23b;
    --good:#7fd16a; --bad:#ec6a5a; --wood:#c58a4a; --stone:#a9b4bd; --food:#9ccf4f; --goldr:#f0c24b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Trebuchet MS", system-ui, sans-serif; }
  body { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 24px; }
  #app { max-width: 1120px; margin: 0 auto; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 1px; color: var(--gold); }
  #res { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .r { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-weight: bold; }
  .r small { color: var(--mute); font-weight: normal; }
  .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .dot.wood { background: var(--wood); } .dot.stone { background: var(--stone); } .dot.food { background: var(--food); } .dot.gold { background: var(--goldr); border-radius: 50%; }
  .ctl { display: flex; gap: 6px; align-items: center; color: var(--mute); font-size: .85rem; }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--accent); color: #2a1a05; border: 0; border-radius: 8px; padding: 7px 12px; font-weight: bold; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:disabled { background: #3a4a40; color: #78897c; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: normal; padding: 5px 9px; }
  .btn.ghost.on { background: var(--panel2); border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
  .card h2 { margin: 0 0 8px; font-size: 1rem; color: var(--mute); text-transform: uppercase; letter-spacing: 2px; font-weight: normal; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; border-radius: 12px;
    background: radial-gradient(circle at 30% 20%, #6aa043, #4a7a2e 70%); box-shadow: inset 0 0 40px #0006; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px dashed #ffffff33; background: #ffffff10; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: #fff; transition: transform .12s, background .12s; }
  .tile:hover { transform: translateY(-2px); background: #ffffff22; }
  .tile.has { border: 2px solid #00000033; background: linear-gradient(#8bbf5e55, #5d903a55); }
  .tile svg { width: 86%; height: 86%; filter: drop-shadow(0 3px 2px #0005); }
  .tile .plus { font-size: 1.8rem; opacity: .6; }
  .tile .lv { position: absolute; right: 4px; bottom: 4px; background: #1b261f; color: var(--gold); font-size: .72rem; font-weight: bold; padding: 1px 6px; border-radius: 99px; }
  .tile .bar { position: absolute; left: 6px; right: 6px; top: 6px; height: 6px; background: #0006; border-radius: 99px; overflow: hidden; }
  .tile .bar i { display: block; height: 100%; background: var(--gold); }
  .tile.build svg { opacity: .55; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row .info { min-width: 0; flex: 1 1 160px; }
  .row .info b { display: block; }
  .row .info small { color: var(--mute); }
  .cost { display: inline-flex; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--mute); }
  .cost span { display: inline-flex; align-items: center; gap: 4px; }
  .cost span.no { color: var(--bad); }
  .meter { height: 8px; border-radius: 99px; background: #0005; overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--bad); }
  .meter.go i { background: var(--accent); }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--mute); }
  .tag.win { background: #2f5a2a; color: #cdf3bd; } .tag.lose { background: #5d2b25; color: #ffd0c8; }
  .log { max-height: 340px; overflow-y: auto; display: grid; gap: 6px; }
  .log div { background: var(--panel2); border-radius: 8px; padding: 8px 10px; font-size: .88rem; line-height: 1.4; }
  .log div.bad { border-left: 3px solid var(--bad); } .log div.good { border-left: 3px solid var(--good); }
  #modal { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal[hidden] { display: none; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: min(460px, 100%); max-height: 88vh; overflow-y: auto; }
  #modal h3 { margin: 0 0 4px; color: var(--gold); }
  .num { display: flex; align-items: center; gap: 6px; }
  .num input { width: 64px; background: #0005; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; font: inherit; text-align: center; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; display: grid; gap: 6px; z-index: 20; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
  .toast { background: #101813f0; border: 1px solid var(--accent); border-radius: 10px; padding: 9px 12px; font-size: .9rem; animation: up .3s ease; }
  .toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--good); }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .hint { color: var(--mute); font-size: .85rem; line-height: 1.4; margin: 0 0 8px; }
  .win-screen { text-align: center; padding: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>KÖY KURUCU</h1>
    <div id="res"></div>
    <div class="ctl">
      <span id="clock"></span>
      <button class="btn ghost" data-speed="1">×1</button><button class="btn ghost" data-speed="2">×2</button><button class="btn ghost" data-speed="4">×4</button>
      <button class="btn ghost" data-act="newgame">Yeni oyun</button>
    </div>
  </header>
  <main>
    <section class="card"><h2>Köyün</h2><div id="grid"></div><p class="hint" style="margin-top:10px">Boş araziye dokunarak bina kur, binaya dokunarak yükselt. Ana bina diğer binaların seviye sınırını belirler.</p></section>
    <section class="card">
      <div class="tabs">
        <button class="btn ghost" data-tab="army">Ordu</button>
        <button class="btn ghost" data-tab="map">Harita</button>
        <button class="btn ghost" data-tab="log">Raporlar</button>
      </div>
      <div id="panel"></div>
    </section>
  </main>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const RES = ['wood', 'stone', 'food', 'gold'];
const RN = { wood: 'Odun', stone: 'Taş', food: 'Yiyecek', gold: 'Altın' };
const SLOTS = 12, MAXLV = 5;

// ---- Bina tanımları ----
const BLD = {
  hall:     { n: 'Ana Bina',    uniq: true, cost: { wood: 80, stone: 80 },  desc: 'Diğer binaların azami seviyesini belirler.' },
  farm:     { n: 'Çiftlik',     rate: ['food', 3.0], cost: { wood: 50, stone: 20 }, desc: 'Yiyecek üretir.' },
  wood:     { n: 'Oduncu',      rate: ['wood', 2.6], cost: { wood: 30, stone: 30 }, desc: 'Odun üretir.' },
  quarry:   { n: 'Taş Ocağı',   rate: ['stone', 2.0], cost: { wood: 60, stone: 20 }, desc: 'Taş üretir.' },
  market:   { n: 'Pazar',       rate: ['gold', 1.5], cost: { wood: 80, stone: 60 }, desc: 'Altın üretir.' },
  house:    { n: 'Ev',          cost: { wood: 50, stone: 40 }, desc: 'Nüfus sınırını +10 artırır.' },
  barracks: { n: 'Kışla',       uniq: true, cost: { wood: 120, stone: 90, gold: 20 }, desc: 'Asker eğitir. Seviye 2 süvariyi açar, eğitimi hızlandırır.' },
  wall:     { n: 'Sur',         uniq: true, cost: { wood: 60, stone: 140 }, desc: 'Baskınlara karşı savunmayı güçlendirir.' },
};
const UNIT = {
  inf: { n: 'Piyade', atk: 6,  hp: 20, time: 8,  cost: { food: 30, wood: 20, gold: 10 }, beats: 'cav', info: 'Süvariye güçlü' },
  arc: { n: 'Okçu',   atk: 9,  hp: 12, time: 10, cost: { food: 25, wood: 30, gold: 20 }, beats: 'inf', info: 'Piyadeye güçlü' },
  cav: { n: 'Süvari', atk: 12, hp: 28, time: 15, cost: { food: 60, wood: 20, gold: 50 }, beats: 'arc', info: 'Okçuya güçlü · Kışla 2' },
};
const UK = ['inf', 'arc', 'cav'];

// ---- Düşman köyler ----
const VILL = [
  { n: 'Kuzey Ovası', dist: 22, lvl: 1, army: { inf: 5, arc: 2, cav: 0 }, wall: 0.05 },
  { n: 'Taşlıdere',   dist: 32, lvl: 2, army: { inf: 8, arc: 5, cav: 1 }, wall: 0.12 },
  { n: 'Kara Orman',  dist: 42, lvl: 3, army: { inf: 10, arc: 10, cav: 4 }, wall: 0.2 },
  { n: 'Demirkaya',   dist: 55, lvl: 4, army: { inf: 16, arc: 12, cav: 9 }, wall: 0.3 },
  { n: 'Ejder Kalesi', dist: 70, lvl: 5, army: { inf: 24, arc: 20, cav: 16 }, wall: 0.45 },
];

let S, speed = 1, tab = 'army', acc = 0, lastTs = 0;

function fresh() {
  const b = Array(SLOTS).fill(null);
  b[0] = { t: 'hall', l: 1 }; b[1] = { t: 'farm', l: 1 }; b[2] = { t: 'wood', l: 1 }; b[3] = { t: 'house', l: 1 };
  return {
    t: 0, res: { wood: 260, stone: 200, food: 220, gold: 90 }, b,
    units: { inf: 0, arc: 0, cav: 0 }, queue: [], marches: [], log: [],
    v: VILL.map((d, i) => ({ i, morale: 100, conq: false, army: { ...d.army }, max: { ...d.army }, stock: { wood: 60 * d.lvl, stone: 50 * d.lvl, food: 60 * d.lvl, gold: 40 * d.lvl },
      nextRaid: 240 + i * 50 + Math.random() * 90, scout: null, scoutAt: -999 })),
    won: false,
  };
}
function load() { try { const j = localStorage.getItem('koy-kurucu-v1'); if (j) return JSON.parse(j); } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem('koy-kurucu-v1', JSON.stringify(S)); } catch (e) {} }

// ---- Yardımcılar ----
const hallLv = () => (S.b.find(x => x && x.t === 'hall') || { l: 0 }).l;
const lvOf = t => { const x = S.b.find(y => y && y.t === t); return x ? x.l : 0; };
const maxLv = t => t === 'hall' ? MAXLV : Math.min(MAXLV, hallLv());
const cost = (t, lv) => Object.fromEntries(Object.entries(BLD[t].cost).map(([k, v]) => [k, Math.round(v * Math.pow(1.6, lv))]));
const buildTime = lv => 6 + 7 * lv;
const popCap = () => 15 + 10 * S.b.reduce((s, x) => s + (x && x.t === 'house' ? x.l : 0), 0);
const homeCount = () => UK.reduce((s, k) => s + S.units[k], 0);
const marchCount = () => S.marches.reduce((s, m) => s + UK.reduce((q, k) => q + m.units[k], 0), 0);
const queueCount = () => S.queue.reduce((s, q) => s + q.n, 0);
const popUsed = () => homeCount() + marchCount() + queueCount();
const can = c => Object.entries(c).every(([k, v]) => S.res[k] >= v);
const pay = c => Object.entries(c).forEach(([k, v]) => S.res[k] -= v);
const rates = () => {
  const r = { wood: 0, stone: 0, food: 0, gold: 0 };
  for (const x of S.b) if (x && BLD[x.t].rate) r[BLD[x.t].rate[0]] += BLD[x.t].rate[1] * x.l;
  for (const v of S.v) if (v.conq) { const l = VILL[v.i].lvl * 1.2; RES.forEach(k => r[k] += l); }
  r.food -= (homeCount() + marchCount()) * 0.06;
  return r;
};
const wallBonus = () => 1 + 0.12 * lvOf('wall');
const fmt = n => Math.floor(n).toLocaleString('tr-TR');
const costHtml = c => '<span class="cost">' + Object.entries(c).map(([k, v]) => `<span class="${S.res[k] >= v ? '' : 'no'}"><i class="dot ${k}"></i>${fmt(v)}</span>`).join('') + '</span>';
function say(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toasts'); while (box.children.length >= 4) box.firstChild.remove(); box.appendChild(el); setTimeout(() => el.remove(), 4200);
}
function report(msg, kind = '') { S.log.unshift({ t: S.t, msg, kind }); S.log.length = Math.min(S.log.length, 40); }
const clock = t => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

// ---- Savaş ----
function mult(type, enemy) {
  const tot = UK.reduce((s, k) => s + enemy[k], 0); if (tot <= 0) return 1;
  const strong = enemy[UNIT[type].beats] / tot;
  const weak = enemy[UK.find(k => UNIT[k].beats === type)] / tot;
  return 1 + 0.6 * strong - 0.3 * weak;
}
function battle(att, def, defBonus) {
  let a = { ...att }, d = { ...def };
  const sum = o => UK.reduce((s, k) => s + o[k], 0);
  for (let r = 0; r < 14 && sum(a) >= 0.5 && sum(d) >= 0.5; r++) {
    const pa = UK.reduce((s, k) => s + a[k] * UNIT[k].atk * mult(k, d), 0);
    const pd = UK.reduce((s, k) => s + d[k] * UNIT[k].atk * mult(k, a), 0) * defBonus;
    const ha = UK.reduce((s, k) => s + a[k] * UNIT[k].hp, 0), hd = UK.reduce((s, k) => s + d[k] * UNIT[k].hp, 0);
    const fa = Math.min(1, pd * 0.3 / ha), fd = Math.min(1, pa * 0.3 / hd);
    UK.forEach(k => { a[k] *= 1 - fa; d[k] *= 1 - fd; });
  }
  const attWin = sum(a) > sum(d) * 1.0 + 0.4;
  const out = { attWin, margin: Math.min(1, (sum(a) - sum(d)) / Math.max(1, sum(att))) };
  out.attLeft = {}; out.defLeft = {};
  UK.forEach(k => {
    out.attLeft[k] = attWin ? Math.round(a[k]) : Math.floor(a[k] * 0.3);
    out.defLeft[k] = attWin ? Math.round(d[k]) : Math.round(d[k]);
  });
  if (attWin) UK.forEach(k => out.defLeft[k] = Math.round(d[k]));
  return out;
}

// ---- Oyun döngüsü ----
function tick(dt) {
  S.t += dt;
  const r = rates();
  RES.forEach(k => { S.res[k] = Math.max(0, S.res[k] + r[k] * dt); });
  // inşaat
  for (const x of S.b) if (x && x.until && S.t >= x.until) { x.l = x.to; x.until = null; say(BLD[x.t].n + ' seviye ' + x.l + ' hazır.', 'good'); }
  // eğitim
  if (S.queue.length) {
    const q = S.queue[0]; q.left -= dt;
    if (q.left <= 0) {
      S.units[q.u]++; q.n--;
      if (q.n <= 0) S.queue.shift(); else q.left = trainTime(q.u);
    }
  }
  // seferler
  for (const m of [...S.marches]) {
    if (m.stage === 'go' && S.t >= m.arrive) resolveAttack(m);
    else if (m.stage === 'back' && S.t >= m.back) {
      UK.forEach(k => S.units[k] += m.units[k]);
      RES.forEach(k => S.res[k] += m.loot[k] || 0);
      S.marches.splice(S.marches.indexOf(m), 1);
      const lootTxt = RES.filter(k => m.loot[k] > 0).map(k => fmt(m.loot[k]) + ' ' + RN[k].toLowerCase()).join(', ');
      if (UK.some(k => m.units[k] > 0)) say('Birlikler ' + VILL[m.vi].n + ' seferinden döndü' + (lootTxt ? ': ' + lootTxt : '') + '.', 'good');
    }
  }
  // düşman köyler
  for (const v of S.v) {
    if (v.conq) continue;
    v.morale = Math.min(100, v.morale + dt * 0.1);
    UK.forEach(k => { if (v.army[k] < v.max[k] && Math.random() < dt / 22) v.army[k]++; });
    RES.forEach(k => v.stock[k] += dt * VILL[v.i].lvl * 0.5);
    if (S.t >= v.nextRaid) { raid(v); v.nextRaid = S.t + 200 + Math.random() * 120; }
  }
  if (!S.won && S.v.every(v => v.conq)) { S.won = true; showWin(); }
}
function trainTime(u) { return UNIT[u].time / (1 + 0.18 * (lvOf('barracks') - 1)); }

function resolveAttack(m) {
  const v = S.v[m.vi], d = VILL[m.vi];
  if (v.conq) { m.loot = {}; m.stage = 'back'; m.back = S.t + d.dist; return; }
  const res = battle(m.units, v.army, 1 + d.wall);
  const lostA = UK.map(k => (m.units[k] - res.attLeft[k]) + ' ' + UNIT[k].n.toLowerCase()).join(', ');
  if (res.attWin) {
    const cap = UK.reduce((s, k) => s + res.attLeft[k], 0) * 40;
    const loot = {}; let tot = 0; RES.forEach(k => { loot[k] = Math.floor(v.stock[k] * 0.45); tot += loot[k]; });
    if (tot > cap) RES.forEach(k => loot[k] = Math.floor(loot[k] * cap / tot));
    RES.forEach(k => v.stock[k] -= loot[k]);
    m.loot = loot;
    v.army = res.defLeft;
    v.morale -= 28 + 30 * res.margin;
    const lootTxt = RES.filter(k => loot[k] > 0).map(k => fmt(loot[k]) + ' ' + RN[k].toLowerCase()).join(', ');
    if (v.morale <= 0) { v.conq = true; v.morale = 0; report(`${d.n} fethedildi! Artık her saniye vergi öder. Kayıp: ${lostA}.`, 'good'); say(d.n + ' fethedildi!', 'good'); }
    else { report(`${d.n} köyünü yendin. Ganimet: ${lootTxt || 'yok'}. Kayıp: ${lostA}. Moral: ${Math.ceil(v.morale)}.`, 'good'); say(d.n + ' savaşı kazanıldı.', 'good'); }
  } else {
    m.loot = {};
    v.army = res.defLeft;
    report(`${d.n} saldırısı başarısız. Kayıp: ${lostA}. Sağ kalanlar geri çekiliyor.`, 'bad'); say(d.n + ' saldırısı yenildi.', 'bad');
  }
  m.units = res.attLeft; m.stage = 'back'; m.back = S.t + d.dist;
}

function raid(v) {
  if (S.t < 200) return;
  const d = VILL[v.i];
  const f = 0.55 + Math.random() * 0.25;
  const raiders = {}; UK.forEach(k => raiders[k] = Math.round(v.max[k] * f));
  const res = battle(raiders, S.units, wallBonus());
  // saldıran taraf = köylü; res.attWin düşman kazandı demek
  if (res.attWin) {
    const lost = {}; RES.forEach(k => { lost[k] = Math.floor(S.res[k] * 0.2); S.res[k] -= lost[k]; });
    UK.forEach(k => S.units[k] = Math.min(S.units[k], res.defLeft[k]));
    report(`${d.n} köyünü bastı! Odun, taş, yiyecek ve altının %20'sini kaybettin. Daha fazla asker ve sur gerekli.`, 'bad'); say(d.n + ' köyünü bastı!', 'bad');
  } else {
    UK.forEach(k => S.units[k] = Math.min(S.units[k], res.defLeft[k]));
    report(`${d.n} baskınını püskürttün.`, 'good'); say(d.n + ' baskınını püskürttün.', 'good');
  }
}

// ---- Çizim: bina ikonları ----
function icon(t) {
  const S_ = {
    hall: '<rect x="12" y="28" width="40" height="28" rx="2" fill="#d6b27a"/><polygon points="8,30 32,10 56,30" fill="#9b3d2e"/><rect x="26" y="40" width="12" height="16" fill="#5b3a22"/><rect x="31" y="2" width="2" height="12" fill="#eee"/><polygon points="33,2 44,6 33,10" fill="#f0c24b"/><rect x="16" y="34" width="7" height="7" fill="#6d4a2c"/><rect x="41" y="34" width="7" height="7" fill="#6d4a2c"/>',
    farm: '<rect x="4" y="30" width="56" height="28" rx="3" fill="#c9a23d"/><path d="M4 38h56M4 46h56M4 54h56" stroke="#8d6f1f" stroke-width="2"/><rect x="34" y="12" width="22" height="20" fill="#b3402f"/><polygon points="31,14 45,3 59,14" fill="#7a2a20"/><rect x="40" y="20" width="10" height="12" fill="#f3e3c0"/>',
    wood: '<rect x="6" y="40" width="34" height="9" rx="4.5" fill="#8a5a2b"/><rect x="6" y="50" width="34" height="9" rx="4.5" fill="#a06a35"/><rect x="12" y="30" width="34" height="9" rx="4.5" fill="#9a6431"/><circle cx="40" cy="44.5" r="3" fill="#d6a56a"/><circle cx="40" cy="54.5" r="3" fill="#d6a56a"/><rect x="44" y="12" width="14" height="22" fill="#6d4a2c"/><polygon points="42,14 51,4 60,14" fill="#2f6b34"/><polygon points="46,6 51,0 56,6" fill="#3f8a43"/>',
    quarry: '<polygon points="4,56 18,26 32,56" fill="#8e99a3"/><polygon points="22,56 38,16 56,56" fill="#a9b4bd"/><polygon points="38,16 56,56 44,56" fill="#8e99a3"/><polygon points="38,16 31,36 42,30" fill="#d3dbe2"/><rect x="8" y="52" width="10" height="6" fill="#6b5a45"/>',
    market: '<rect x="8" y="30" width="48" height="26" fill="#d9c08f"/><path d="M6 30l4-14h44l4 14z" fill="#d94f3d"/><path d="M14 16l-4 14M26 16l-2 14M38 16l2 14M50 16l4 14" stroke="#fff" stroke-width="3"/><circle cx="32" cy="44" r="8" fill="#f0c24b" stroke="#b78a1b" stroke-width="2"/><text x="32" y="48" font-size="11" text-anchor="middle" fill="#7a5a10" font-weight="bold">₺</text>',
    house: '<rect x="12" y="30" width="40" height="26" fill="#e6d3ad"/><polygon points="8,32 32,12 56,32" fill="#b3402f"/><rect x="42" y="10" width="7" height="14" fill="#7a6a5a"/><rect x="26" y="40" width="12" height="16" fill="#6d4a2c"/><rect x="15" y="36" width="8" height="8" fill="#7fb8d6"/>',
    barracks: '<rect x="8" y="26" width="48" height="30" fill="#8e99a3"/><path d="M8 26h8v-6h8v6h8v-6h8v6h8v-6h8v6" fill="#8e99a3" stroke="#6f7a84" stroke-width="2"/><rect x="26" y="38" width="12" height="18" fill="#4b3320"/><rect x="12" y="32" width="4" height="12" fill="#c0392b"/><rect x="48" y="32" width="4" height="12" fill="#c0392b"/><path d="M50 10l-14 14M36 10l14 14" stroke="#e8ecef" stroke-width="3" stroke-linecap="round"/>',
    wall: '<rect x="4" y="28" width="56" height="28" fill="#a9a08f"/><path d="M4 28V18h8v6h8v-6h8v6h8v-6h8v6h8v-6h8v10" fill="#a9a08f" stroke="#7d7566" stroke-width="2"/><path d="M4 40h56M18 28v12M38 28v12M28 40v16M48 40v16M10 40v16" stroke="#7d7566" stroke-width="2"/>',
  };
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${S_[t]}</svg>`;
}

// ---- Arayüz ----
function renderRes() {
  const r = rates();
  $('#res').innerHTML = RES.map(k => `<div class="r"><i class="dot ${k}"></i>${fmt(S.res[k])}<small>${r[k] >= 0 ? '+' : ''}${r[k].toFixed(1)}/sn</small></div>`).join('')
    + `<div class="r" title="Nüfus">👥 ${popUsed()}/${popCap()}</div>`;
  $('#clock').textContent = 'Gün ' + (1 + Math.floor(S.t / 300)) + ' · ' + clock(S.t);
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === speed));
}
function renderGrid() {
  $('#grid').innerHTML = S.b.map((x, i) => {
    if (!x) return `<button class="tile" data-slot="${i}" aria-label="Boş arsa"><span class="plus">+</span></button>`;
    const building = x.until;
    const p = building ? Math.min(100, 100 - (x.until - S.t) / buildTime(x.to - 1) * 100) : 0;
    return `<button class="tile has ${building ? 'build' : ''}" data-slot="${i}" title="${BLD[x.t].n}">${icon(x.t)}<span class="lv">${building ? '⚒ ' + (x.to) : x.l}</span>${building ? `<span class="bar"><i style="width:${p}%"></i></span>` : ''}</button>`;
  }).join('');
}
function renderPanel() {
  const el = $('#panel');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'army') el.innerHTML = armyHtml();
  else if (tab === 'map') el.innerHTML = mapHtml();
  else el.innerHTML = logHtml();
}
function armyHtml() {
  const bar = lvOf('barracks');
  let h = '';
  if (!bar) h += '<p class="hint">Asker eğitmek için önce bir <b>Kışla</b> inşa et.</p>';
  h += UK.map(k => {
    const u = UNIT[k], locked = !bar || (k === 'cav' && bar < 2);
    const away = S.marches.reduce((s, m) => s + m.units[k], 0);
    return `<div class="row"><div class="info"><b>${u.n} <small>· evde ${S.units[k]}${away ? ' · seferde ' + away : ''}</small></b><small>Saldırı ${u.atk} · Can ${u.hp} · ${u.info}</small><br>${costHtml(u.cost)}</div>
      <div><button class="btn" data-train="${k}" data-n="1" ${locked ? 'disabled' : ''}>+1</button> <button class="btn" data-train="${k}" data-n="5" ${locked ? 'disabled' : ''}>+5</button></div></div>`;
  }).join('');
  if (S.queue.length) {
    h += '<h2 style="margin-top:12px">Eğitim sırası</h2>' + S.queue.map((q, i) => `<div class="row"><div class="info"><b>${UNIT[q.u].n} × ${q.n}</b>${i === 0 ? `<div class="meter go"><i style="width:${100 - q.left / trainTime(q.u) * 100}%"></i></div>` : '<small>Bekliyor</small>'}</div></div>`).join('');
  }
  h += `<p class="hint" style="margin-top:10px">Taş-kağıt-makas: Piyade → Süvari → Okçu → Piyade. Askerler saniyede biraz yiyecek tüketir. Sur ve evdeki asker baskınlara karşı savunur.</p>`;
  return h;
}
function strengthWord(v) {
  const sc = UK.reduce((s, k) => s + (v.scout ? v.scout[k] : v.army[k]) * UNIT[k].atk, 0);
  const mine = UK.reduce((s, k) => s + S.units[k] * UNIT[k].atk, 0);
  if (!mine) return ['—', ''];
  const q = mine / Math.max(1, sc * (1 + VILL[v.i].wall));
  return q > 1.6 ? ['Kolay', 'win'] : q > 1 ? ['Dengeli', ''] : ['Tehlikeli', 'lose'];
}
function scout(v) {
  if (S.t - v.scoutAt > 25 || !v.scout) { v.scout = {}; UK.forEach(k => v.scout[k] = Math.max(0, Math.round(v.army[k] * (0.8 + Math.random() * 0.4)))); v.scoutAt = S.t; }
}
function mapHtml() {
  let h = '<p class="hint">Yan köyleri yen, moralini sıfırla ve fethet. Fethedilen köyler sürekli vergi öder. Beş köyü de fethedersen kazanırsın.</p>';
  h += S.v.map(v => {
    const d = VILL[v.i]; scout(v);
    const [w, cls] = strengthWord(v);
    if (v.conq) return `<div class="row"><div class="info"><b>${d.n} <span class="tag win">Fethedildi</span></b><small>Her saniye ${(d.lvl * 1.2).toFixed(1)} birim her kaynaktan vergi.</small></div></div>`;
    const sc = v.scout;
    return `<div class="row"><div class="info"><b>${d.n} <small>· seviye ${d.lvl} · yol ${d.dist} sn</small> <span class="tag ${cls}">${w}</span></b>
      <small>Casus: ~${sc.inf} piyade, ~${sc.arc} okçu, ~${sc.cav} süvari · sur +%${Math.round(d.wall * 100)}</small>
      <div class="meter"><i style="width:${v.morale}%"></i></div><small>Moral ${Math.ceil(v.morale)}</small></div>
      <button class="btn" data-attack="${v.i}" ${homeCount() ? '' : 'disabled'}>Saldır</button></div>`;
  }).join('');
  if (S.marches.length) {
    h += '<h2 style="margin-top:12px">Seferler</h2>' + S.marches.map(m => {
      const total = VILL[m.vi].dist, left = m.stage === 'go' ? m.arrive - S.t : m.back - S.t;
      const pct = (1 - left / total) * 100;
      return `<div class="row"><div class="info"><b>${VILL[m.vi].n} ${m.stage === 'go' ? '→' : '← dönüş'}</b><small>${UK.map(k => m.units[k] + ' ' + UNIT[k].n.toLowerCase()).join(', ')} · ${Math.ceil(left)} sn</small><div class="meter go"><i style="width:${pct}%"></i></div></div></div>`;
    }).join('');
  }
  return h;
}
function logHtml() {
  if (!S.log.length) return '<p class="hint">Henüz rapor yok. Savaşlar ve baskınlar burada görünür.</p>';
  return '<div class="log">' + S.log.map(l => `<div class="${l.kind}"><small>${clock(l.t)}</small> ${l.msg}</div>`).join('') + '</div>';
}

// ---- Modal ----
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
function slotModal(i) {
  const x = S.b[i];
  if (!x) {
    const opts = Object.keys(BLD).filter(t => !(BLD[t].uniq && S.b.some(y => y && y.t === t)));
    openModal(`<h3>Ne inşa edelim?</h3><p class="hint">Yeni bina seviye 1 olarak kurulur.</p>` + opts.map(t => {
      const c = cost(t, 0);
      return `<div class="row"><div class="info"><b>${BLD[t].n}</b><small>${BLD[t].desc}</small><br>${costHtml(c)}</div><button class="btn" data-build="${t}" data-slot="${i}" ${can(c) ? '' : 'disabled'}>İnşa et</button></div>`;
    }).join('') + '<p style="text-align:right"><button class="btn ghost" data-act="close">Kapat</button></p>');
    return;
  }
  const B = BLD[x.t], c = cost(x.t, x.l), mx = maxLv(x.t);
  let prod = '';
  if (B.rate) prod = `<p class="hint">Üretim: ${(B.rate[1] * x.l).toFixed(1)} ${RN[B.rate[0]].toLowerCase()}/sn${x.l < MAXLV ? ' → ' + (B.rate[1] * (x.l + 1)).toFixed(1) : ''}</p>`;
  const note = x.until ? 'İnşaat sürüyor…' : x.l >= MAXLV ? 'Azami seviye.' : x.l >= mx ? 'Önce Ana Bina’yı yükselt.' : '';
  openModal(`<h3>${B.n} · seviye ${x.l}</h3><p class="hint">${B.desc}</p>${prod}
    ${x.l < MAXLV ? `<div class="row"><div class="info"><b>Seviye ${x.l + 1}</b><small>${buildTime(x.l)} sn</small><br>${costHtml(c)}</div><button class="btn" data-upgrade="${i}" ${(!x.until && x.l < mx && can(c)) ? '' : 'disabled'}>Yükselt</button></div>` : ''}
    ${note ? `<p class="hint">${note}</p>` : ''}<p style="text-align:right"><button class="btn ghost" data-act="close">Kapat</button></p>`);
}
function attackModal(vi) {
  const v = S.v[vi], d = VILL[vi];
  openModal(`<h3>${d.n} köyüne saldır</h3><p class="hint">Yol ${d.dist} sn. Casus raporu: ~${v.scout.inf} piyade, ~${v.scout.arc} okçu, ~${v.scout.cav} süvari. Sur +%${Math.round(d.wall * 100)}.</p>`
    + UK.map(k => `<div class="row"><div class="info"><b>${UNIT[k].n}</b><small>Evde ${S.units[k]}</small></div><div class="num"><input type="number" id="send-${k}" min="0" max="${S.units[k]}" value="0" ${S.units[k] ? '' : 'disabled'}><button class="btn ghost" data-all="${k}">Hepsi</button></div></div>`).join('')
    + `<p class="hint" id="atkest"></p><p style="text-align:right"><button class="btn ghost" data-act="close">Vazgeç</button> <button class="btn" data-send="${vi}">Gönder</button></p>`);
}
function sendAttack(vi) {
  const units = {}; let n = 0;
  UK.forEach(k => { const el = $('#send-' + k); const q = Math.max(0, Math.min(S.units[k], parseInt(el.value) || 0)); units[k] = q; n += q; });
  if (!n) { say('Göndermek için asker seç.', 'bad'); return; }
  UK.forEach(k => S.units[k] -= units[k]);
  S.marches.push({ vi, units, stage: 'go', arrive: S.t + VILL[vi].dist, back: 0, loot: {} });
  closeModal(); say(units.inf + units.arc + units.cav + ' asker ' + VILL[vi].n + ' köyüne yola çıktı.');
  renderAll();
}
function showWin() {
  openModal(`<div class="win-screen"><h3>Zafer!</h3><p>Beş köyü de fethettin. Bölgenin tek hâkimi sensin.</p><p class="hint">Gün ${1 + Math.floor(S.t / 300)} · ${clock(S.t)}</p><button class="btn" data-act="newgame">Yeni oyun</button> <button class="btn ghost" data-act="close">Oynamaya devam et</button></div>`);
}

// ---- Olaylar ----
document.addEventListener('click', e => {
  const t = e.target.closest('button, #modal'); if (!t) return;
  if (t.id === 'modal' && e.target === t) return closeModal();
  const d = t.dataset;
  if (d.speed) { speed = +d.speed; renderRes(); }
  else if (d.tab) { tab = d.tab; renderPanel(); }
  else if (d.slot !== undefined && !d.build) slotModal(+d.slot);
  else if (d.build) {
    const c = cost(d.build, 0); if (!can(c)) return say('Kaynak yetmiyor.', 'bad');
    pay(c); S.b[+d.slot] = { t: d.build, l: 0, to: 1, until: S.t + buildTime(0) };
    closeModal(); renderAll();
  } else if (d.upgrade) {
    const x = S.b[+d.upgrade], c = cost(x.t, x.l); if (!can(c) || x.until || x.l >= maxLv(x.t)) return;
    pay(c); x.to = x.l + 1; x.until = S.t + buildTime(x.l); closeModal(); renderAll();
  } else if (d.train) {
    const k = d.train, n = +d.n;
    const room = popCap() - popUsed();
    if (room < n) return say('Nüfus sınırı dolu. Ev inşa et.', 'bad');
    const c = Object.fromEntries(Object.entries(UNIT[k].cost).map(([r, v]) => [r, v * n]));
    if (!can(c)) return say('Kaynak yetmiyor.', 'bad');
    pay(c);
    const last = S.queue[S.queue.length - 1];
    if (last && last.u === k && S.queue.length > 1) last.n += n; else S.queue.push({ u: k, n, left: trainTime(k) });
    renderAll();
  } else if (d.attack !== undefined) attackModal(+d.attack);
  else if (d.all) { const el = $('#send-' + d.all); el.value = S.units[d.all]; }
  else if (d.send !== undefined) sendAttack(+d.send);
  else if (d.act === 'close') closeModal();
  else if (d.act === 'newgame') { S = fresh(); save(); closeModal(); renderAll(); say('Yeni köy kuruldu.'); }
});

function renderAll() { renderRes(); renderGrid(); renderPanel(); }
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.5); lastTs = ts;
  tick(dt * speed);
  acc += dt;
  renderRes();
  if (acc >= 0.5) { acc = 0; renderGrid(); if ($('#modal').hidden) renderPanel(); }
  requestAnimationFrame(loop);
}
S = load();
// eski kayıt uyumu
if (!S || !S.b || !S.v) S = fresh();
renderAll();
setInterval(save, 5000);
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
if (S.t < 2) say('Köyüne hoş geldin! Önce üretim binalarını yükselt, sonra Kışla kur.');
</script>
</body>
</html>
