<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ada Krallığı</title>
<style>
  :root { color-scheme: dark; --panel:#1b2a23ee; --panel2:#27392f; --line:#3d5a47; --ink:#eef3e8; --mute:#a2b8a7; --gold:#f2c14e; --accent:#e9a23b; --bad:#ec6a5a; --good:#7fd16a;
    --wood:#c58a4a; --stone:#a9b4bd; --food:#9ccf4f; --goldr:#f0c24b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #8fd3f4; color: var(--ink); font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; z-index: 5; }
  #top { top: max(8px, env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 7px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; pointer-events: auto; backdrop-filter: blur(6px); }
  .r { display: flex; align-items: center; gap: 6px; font-weight: bold; font-variant-numeric: tabular-nums; font-size: .92rem; }
  .r small { color: var(--mute); font-weight: normal; font-size: .75rem; }
  .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .dot.wood { background: var(--wood); } .dot.stone { background: var(--stone); } .dot.food { background: var(--food); } .dot.gold { background: var(--goldr); border-radius: 50%; }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--accent); color: #2a1a05; border: 0; border-radius: 9px; padding: 8px 14px; font-weight: bold; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:disabled { background: #3a4a40; color: #78897c; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: normal; padding: 5px 9px; }
  .btn.ghost.on { background: var(--panel2); border-color: var(--accent); color: var(--accent); }
  #mini { bottom: max(10px, env(safe-area-inset-bottom, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--line); background: #0d3b5acc; }
  #prompt { bottom: max(24px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 9px 16px; font-weight: bold; text-align: center; max-width: 80vw; display: none; }
  #prompt kbd { background: var(--accent); color: #2a1a05; border-radius: 5px; padding: 1px 7px; margin-right: 6px; }
  #units { top: 64px; right: max(8px, env(safe-area-inset-right, 0px)); font-size: .85rem; display: grid; gap: 2px; }
  #cine { top: 64px; left: 50%; transform: translateX(-50%); display: none; }
  #joy { bottom: max(24px, env(safe-area-inset-bottom, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); width: 110px; height: 110px; border-radius: 50%; background: #ffffff22; border: 2px solid #ffffff55; display: none; touch-action: none; }
  #joy i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: #ffffffaa; }
  #act { bottom: max(34px, env(safe-area-inset-bottom, 0px)); right: max(24px, env(safe-area-inset-right, 0px)); width: 76px; height: 76px; border-radius: 50%; display: none; font-size: 1.1rem; }
  body.touch #joy, body.touch #act { display: block; } body.touch #mini { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); bottom: auto; top: 110px; width: 100px; height: 100px; }
  #modal { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 20; }
  #modal[hidden] { display: none; }
  .box { background: #1b2a23; border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: min(480px, 100%); max-height: 88vh; overflow-y: auto; }
  .box h3 { margin: 0 0 4px; color: var(--gold); }
  .hint { color: var(--mute); font-size: .85rem; line-height: 1.4; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row .info { min-width: 0; flex: 1 1 170px; } .row .info b { display: block; } .row .info small { color: var(--mute); }
  .cost { display: inline-flex; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--mute); }
  .cost span { display: inline-flex; align-items: center; gap: 4px; } .cost span.no { color: var(--bad); }
  .meter { height: 8px; border-radius: 99px; background: #0005; overflow: hidden; margin-top: 4px; } .meter i { display: block; height: 100%; background: var(--bad); } .meter.go i { background: var(--accent); }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--mute); }
  .tag.win { background: #2f5a2a; color: #cdf3bd; } .tag.lose { background: #5d2b25; color: #ffd0c8; }
  .log { display: grid; gap: 6px; } .log div { background: var(--panel2); border-radius: 8px; padding: 8px 10px; font-size: .88rem; line-height: 1.4; }
  .log div.bad { border-left: 3px solid var(--bad); } .log div.good { border-left: 3px solid var(--good); }
  .num { display: flex; align-items: center; gap: 6px; } .num input { width: 62px; background: #0005; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; font: inherit; text-align: center; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: 110px; display: grid; gap: 6px; z-index: 30; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
  .toast { background: #101813f0; border: 1px solid var(--accent); border-radius: 10px; padding: 9px 12px; font-size: .9rem; animation: up .3s ease; }
  .toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--good); }
  @keyframes up { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  #intro { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #2d6b8fcc, #0a2538ee); text-align: center; padding: 20px; }
  #intro .box { text-align: center; } #intro h1 { margin: 0 0 6px; font-size: 2.2rem; letter-spacing: 2px; color: var(--gold); }
  #intro kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="top" class="hud"><div class="pill" id="res"></div>
  <div class="pill"><span id="clock" style="color:var(--mute);font-size:.85rem"></span>
    <button class="btn ghost" data-speed="1">×1</button><button class="btn ghost" data-speed="2">×2</button><button class="btn ghost" data-speed="4">×4</button>
    <button class="btn ghost" data-act="log">Raporlar</button><button class="btn ghost" data-act="newgame">Yeni oyun</button></div></div>
<div id="units" class="hud pill"></div>
<canvas id="mini" class="hud" width="260" height="260"></canvas>
<div id="cine" class="hud"><button class="btn" data-act="skipcam">Köye dön (Esc)</button></div>
<div id="prompt" class="hud"></div>
<div id="joy" class="hud"><i></i></div><button id="act" class="btn hud" data-act="interact">E</button>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<div id="intro"><div class="box"><h1>ADA KRALLIĞI</h1>
  <p class="hint">Küçük adanın kralısın. Köyünde yürü, bina kur, asker eğit. Limandan gemiyle komşu adalara çıkartma yap ve hepsini fethet.</p>
  <p class="hint"><kbd>W A S D</kbd> yürü · <kbd>E</kbd> etkileşim · fareyle sürükle kamerayı döndür · tekerlek yakınlaştır<br>Mobilde: sol joystick, sağ düğme, ekranı sürükle.</p>
  <button class="btn" id="go">Başla</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const RES = ['wood', 'stone', 'food', 'gold'];
const RN = { wood: 'Odun', stone: 'Taş', food: 'Yiyecek', gold: 'Altın' };
const MAXLV = 5, HOME_R = 44, SEA_Y = -1.2, SHIP_V = 10, FIGHT = 10;
const TAU = Math.PI * 2;

// ================= OYUN VERİSİ =================
const BLD = {
  hall:     { n: 'Ana Bina',  cost: { wood: 80, stone: 80 }, desc: 'Diğer yapıların azami seviyesini belirler.' },
  farm:     { n: 'Çiftlik',   rate: ['food', 3.0], cost: { wood: 50, stone: 20 }, desc: 'Yiyecek üretir.' },
  wood:     { n: 'Oduncu',    rate: ['wood', 2.6], cost: { wood: 30, stone: 30 }, desc: 'Odun üretir.' },
  quarry:   { n: 'Taş Ocağı', rate: ['stone', 2.0], cost: { wood: 60, stone: 20 }, desc: 'Taş üretir.' },
  market:   { n: 'Pazar',     rate: ['gold', 1.5], cost: { wood: 80, stone: 60 }, desc: 'Altın üretir.' },
  house:    { n: 'Ev',        cost: { wood: 50, stone: 40 }, desc: 'Nüfus sınırını +10 artırır, köye yeni köylüler getirir.' },
  barracks: { n: 'Kışla',     uniq: true, cost: { wood: 120, stone: 90, gold: 20 }, desc: 'Asker eğitir. Seviye 2 süvariyi açar, eğitimi hızlandırır.' },
  port:     { n: 'Liman',     uniq: true, cost: { wood: 150, stone: 100, gold: 30 }, desc: 'Gemiler buradan çıkartmaya gider. Seviye gemi kapasitesini artırır.' },
};
const WALL = { cost: { wood: 60, stone: 140 } };
const UNIT = {
  inf: { n: 'Piyade', atk: 6,  hp: 20, time: 8,  cost: { food: 30, wood: 20, gold: 10 }, beats: 'cav', info: 'Süvariye güçlü' },
  arc: { n: 'Okçu',   atk: 9,  hp: 12, time: 10, cost: { food: 25, wood: 30, gold: 20 }, beats: 'inf', info: 'Piyadeye güçlü' },
  cav: { n: 'Süvari', atk: 12, hp: 28, time: 15, cost: { food: 60, wood: 20, gold: 50 }, beats: 'arc', info: 'Okçuya güçlü · Kışla 2' },
};
const UK = ['inf', 'arc', 'cav'];
const VILL = [
  { n: 'Kuzey Ovası', lvl: 1, army: { inf: 5, arc: 2, cav: 0 }, wall: 0.05, ang: 120, d: 125 },
  { n: 'Taşlıdere',   lvl: 2, army: { inf: 8, arc: 5, cav: 1 }, wall: 0.12, ang: 60, d: 140 },
  { n: 'Kara Orman',  lvl: 3, army: { inf: 10, arc: 10, cav: 4 }, wall: 0.2, ang: 145, d: 165 },
  { n: 'Demirkaya',   lvl: 4, army: { inf: 16, arc: 12, cav: 9 }, wall: 0.3, ang: 35, d: 185 },
  { n: 'Ejder Kalesi', lvl: 5, army: { inf: 24, arc: 20, cav: 16 }, wall: 0.45, ang: 90, d: 235 },
];
// arsalar: 0 ana bina, 1 liman, 2.. serbest
const PLOTS = [{ x: 0, z: 0, k: 'hall' }, { x: 0, z: 34, k: 'port' }];
for (let k = 0; k < 6; k++) { const a = (30 + 60 * k) * Math.PI / 180; PLOTS.push({ x: Math.cos(a) * 14, z: Math.sin(a) * 14, k: 'slot' }); }
for (let k = 0; k < 6; k++) { const a = 60 * k * Math.PI / 180; PLOTS.push({ x: Math.cos(a) * 26, z: Math.sin(a) * 26, k: 'slot' }); }

const DOCK = new THREE.Vector3(0, SEA_Y + 0.5, 52);
const ISL = VILL.map(d => {
  const a = d.ang * Math.PI / 180, pos = new THREE.Vector3(Math.cos(a) * d.d, 0, Math.sin(a) * d.d), r = 16 + 2 * d.lvl;
  const toDock = DOCK.clone().setY(0).sub(pos).normalize();
  const stop = pos.clone().addScaledVector(toDock, r + 10).setY(DOCK.y), land = pos.clone().addScaledVector(toDock, r - 1);
  return { pos, r, stop, land, dirAD: toDock.clone().negate(), sailT: stop.distanceTo(DOCK) / SHIP_V };
});

let S, speed = 1;
function fresh() {
  const b = Array(PLOTS.length).fill(null);
  b[0] = { t: 'hall', l: 1 }; b[2] = { t: 'farm', l: 1 }; b[3] = { t: 'wood', l: 1 }; b[4] = { t: 'house', l: 1 };
  return { t: 0, res: { wood: 280, stone: 220, food: 220, gold: 100 }, b, wall: { l: 0 }, units: { inf: 0, arc: 0, cav: 0 }, queue: [], marches: [], raids: [], log: [], mid: 0, won: false,
    v: VILL.map((d, i) => ({ i, morale: 100, conq: false, army: { ...d.army }, max: { ...d.army }, stock: { wood: 60 * d.lvl, stone: 50 * d.lvl, food: 60 * d.lvl, gold: 40 * d.lvl },
      nextRaid: 260 + i * 60 + Math.random() * 90, scout: null, scoutAt: -999 })) };
}
function load() { try { const j = localStorage.getItem('ada-kralligi-v1'); if (j) { const o = JSON.parse(j); if (o && o.b && o.v && o.b.length === PLOTS.length) return o; } } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem('ada-kralligi-v1', JSON.stringify(S)); } catch (e) {} }

const lvOf = t => { const x = S.b.find(y => y && y.t === t && !y.until || y && y.t === t && y.l); return x ? x.l : 0; };
const hallLv = () => S.b[0].l;
const maxLv = t => t === 'hall' ? MAXLV : Math.min(MAXLV, hallLv());
const cost = (t, lv) => Object.fromEntries(Object.entries(BLD[t].cost).map(([k, v]) => [k, Math.round(v * Math.pow(1.6, lv))]));
const wallCost = lv => Object.fromEntries(Object.entries(WALL.cost).map(([k, v]) => [k, Math.round(v * Math.pow(1.6, lv))]));
const buildTime = lv => 6 + 7 * lv;
const popCap = () => 15 + 10 * S.b.reduce((s, x) => s + (x && x.t === 'house' ? x.l : 0), 0);
const homeCount = () => UK.reduce((s, k) => s + S.units[k], 0);
const marchCount = () => S.marches.reduce((s, m) => s + UK.reduce((q, k) => q + m.units[k], 0), 0);
const queueCount = () => S.queue.reduce((s, q) => s + q.n, 0);
const popUsed = () => homeCount() + marchCount() + queueCount();
const shipCap = () => 10 + 10 * lvOf('port');
const can = c => Object.entries(c).every(([k, v]) => S.res[k] >= v);
const pay = c => Object.entries(c).forEach(([k, v]) => S.res[k] -= v);
const wallBonus = () => 1 + 0.12 * S.wall.l;
const fmt = n => Math.floor(n).toLocaleString('tr-TR');
const clock = t => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const trainTime = u => UNIT[u].time / (1 + 0.18 * (Math.max(1, lvOf('barracks')) - 1));
function rates() {
  const r = { wood: 0, stone: 0, food: 0, gold: 0 };
  for (const x of S.b) if (x && BLD[x.t].rate && x.l) r[BLD[x.t].rate[0]] += BLD[x.t].rate[1] * x.l;
  for (const v of S.v) if (v.conq) RES.forEach(k => r[k] += VILL[v.i].lvl * 1.2);
  r.food -= (homeCount() + marchCount()) * 0.06; return r;
}
function say(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove(); box.appendChild(el); setTimeout(() => el.remove(), 4500);
}
function report(msg, kind = '') { S.log.unshift({ t: S.t, msg, kind }); S.log.length = Math.min(S.log.length, 40); }
const costHtml = c => '<span class="cost">' + Object.entries(c).map(([k, v]) => `<span class="${S.res[k] >= v ? '' : 'no'}"><i class="dot ${k}"></i>${fmt(v)}</span>`).join('') + '</span>';

// ================= SAVAŞ MANTIĞI =================
function mult(type, enemy) {
  const tot = UK.reduce((s, k) => s + enemy[k], 0); if (tot <= 0) return 1;
  return 1 + 0.6 * enemy[UNIT[type].beats] / tot - 0.3 * enemy[UK.find(k => UNIT[k].beats === type)] / tot;
}
function battle(att, def, defBonus) {
  let a = { ...att }, d = { ...def }; const sum = o => UK.reduce((s, k) => s + o[k], 0);
  for (let r = 0; r < 14 && sum(a) >= 0.5 && sum(d) >= 0.5; r++) {
    const pa = UK.reduce((s, k) => s + a[k] * UNIT[k].atk * mult(k, d), 0), pd = UK.reduce((s, k) => s + d[k] * UNIT[k].atk * mult(k, a), 0) * defBonus;
    const ha = UK.reduce((s, k) => s + a[k] * UNIT[k].hp, 0), hd = UK.reduce((s, k) => s + d[k] * UNIT[k].hp, 0);
    const fa = Math.min(1, pd * 0.3 / ha), fd = Math.min(1, pa * 0.3 / hd);
    UK.forEach(k => { a[k] *= 1 - fa; d[k] *= 1 - fd; });
  }
  const attWin = sum(a) > sum(d) + 0.4, out = { attWin, margin: Math.min(1, (sum(a) - sum(d)) / Math.max(1, sum(att))), attLeft: {}, defLeft: {} };
  UK.forEach(k => { out.attLeft[k] = attWin ? Math.round(a[k]) : Math.floor(a[k] * 0.3); out.defLeft[k] = Math.round(d[k]); });
  return out;
}
const lost = (before, after) => { const o = {}; UK.forEach(k => o[k] = Math.max(0, before[k] - after[k])); return o; };

function startAttack(vi, units) {
  UK.forEach(k => S.units[k] -= units[k]);
  const m = { id: ++S.mid, vi, units, stage: 'out', t0: S.t, dur: ISL[vi].sailT, loot: {}, res: null };
  S.marches.push(m); cine = { kind: 'm', id: m.id };
  say('Filo ' + VILL[vi].n + ' adasına yola çıktı.');
}
function fightAttack(m) {
  const v = S.v[m.vi], d = VILL[m.vi], before = { ...m.units }, defBefore = { ...v.army };
  const res = battle(m.units, v.army, 1 + d.wall); m.res = { before, defBefore, attLost: lost(before, res.attLeft), defLost: lost(v.army, res.defLeft), attWin: res.attWin };
  const lostTxt = UK.map(k => m.res.attLost[k] + ' ' + UNIT[k].n.toLowerCase()).join(', ');
  if (res.attWin) {
    const cap = UK.reduce((s, k) => s + res.attLeft[k], 0) * 40; const loot = {}; let tot = 0;
    RES.forEach(k => { loot[k] = Math.floor(v.stock[k] * 0.45); tot += loot[k]; }); if (tot > cap) RES.forEach(k => loot[k] = Math.floor(loot[k] * cap / tot));
    RES.forEach(k => v.stock[k] -= loot[k]); m.loot = loot; v.army = res.defLeft; v.morale -= 28 + 30 * res.margin;
    const lt = RES.filter(k => loot[k] > 0).map(k => fmt(loot[k]) + ' ' + RN[k].toLowerCase()).join(', ');
    if (v.morale <= 0) { v.conq = true; v.morale = 0; report(`${d.n} fethedildi! Artık sürekli vergi öder. Kayıp: ${lostTxt}.`, 'good'); say(d.n + ' fethedildi!', 'good'); }
    else { report(`${d.n} adasına çıkartma başarılı. Ganimet: ${lt || 'yok'}. Kayıp: ${lostTxt}. Moral: ${Math.ceil(v.morale)}.`, 'good'); say('Çıkartma başarılı!', 'good'); }
  } else { m.loot = {}; v.army = res.defLeft; report(`${d.n} çıkartması başarısız. Kayıp: ${lostTxt}.`, 'bad'); say('Çıkartma püskürtüldü.', 'bad'); }
  m.units = res.attLeft;
  spawnBattle({ id: 'm' + m.id, center: ISL[m.vi].land, dirAD: ISL[m.vi].dirAD, att: before, def: defBefore, attLost: m.res.attLost, defLost: m.res.defLost, attTeam: 'blue', defTeam: 'red' });
}
function startRaid(v) {
  const d = VILL[v.i], f = 0.55 + Math.random() * 0.25, raiders = {}; UK.forEach(k => raiders[k] = Math.round(v.max[k] * f));
  const dir = ISL[v.i].pos.clone().normalize(), stopE = ISL[v.i].pos.clone().addScaledVector(dir, -(ISL[v.i].r + 10));
  const stopH = dir.clone().multiplyScalar(HOME_R + 9).setY(DOCK.y), r = { id: ++S.mid, vi: v.i, raiders, stage: 'in', t0: S.t, dur: stopE.distanceTo(stopH) / SHIP_V, dir: [dir.x, dir.z], res: null };
  stopE.y = DOCK.y; S.raids.push(r); cine = { kind: 'r', id: r.id };
  say('⚠ ' + d.n + ' gemileri köyüne yaklaşıyor!', 'bad'); report(d.n + ' baskın filosu gönderdi.', 'bad');
}
function fightRaid(r) {
  const d = VILL[r.vi], before = { ...r.raiders }, defBefore = { ...S.units }, res = battle(r.raiders, S.units, wallBonus());
  r.res = { win: res.attWin };
  if (res.attWin) { RES.forEach(k => S.res[k] -= Math.floor(S.res[k] * 0.2)); report(`${d.n} köyünü bastı! Kaynakların %20'sini kaybettin.`, 'bad'); say(d.n + ' köyü bastı!', 'bad'); }
  else { report(`${d.n} baskınını püskürttün.`, 'good'); say('Baskın püskürtüldü.', 'good'); }
  UK.forEach(k => S.units[k] = Math.min(S.units[k], res.defLeft[k]));
  const dir = new THREE.Vector3(r.dir[0], 0, r.dir[1]);
  spawnBattle({ id: 'r' + r.id, center: dir.clone().multiplyScalar(HOME_R - 3), dirAD: dir.clone().negate(), att: before, def: defBefore, attLost: lost(before, res.attLeft), defLost: lost(defBefore, res.defLeft), attTeam: 'red', defTeam: 'blue' });
}

function tick(dt) {
  S.t += dt;
  const r = rates(); RES.forEach(k => S.res[k] = Math.max(0, S.res[k] + r[k] * dt));
  for (const x of S.b) if (x && x.until && S.t >= x.until) { x.l = x.to; x.until = null; say(BLD[x.t].n + ' seviye ' + x.l + ' hazır.', 'good'); }

  else if (d.wall) { const c = wallCost(S.wall.l); if (!can(c) || S.wall.until || S.wall.l >= maxLv('wall')) return; pay(c); S.wall.to = S.wall.l + 1; S.wall.until = S.t + buildTime(S.wall.l); closeModal(); }
  else if (d.train) { const k = d.train, n = +d.n; if (popCap() - popUsed() < n) return say('Nüfus sınırı dolu. Ev inşa et.', 'bad'); const c = Object.fromEntries(Object.entries(UNIT[k].cost).map(([r, v]) => [r, v * n])); if (!can(c)) return say('Kaynak yetmiyor.', 'bad'); pay(c);
    const last = S.queue[S.queue.length - 1]; if (last && last.u === k && S.queue.length > 1) last.n += n; else S.queue.push({ u: k, n, left: trainTime(k) }); const i = S.b.findIndex(b => b && b.t === 'barracks'); plotMenu(i); }
  else if (d.attack !== undefined) attackMenu(+d.attack);
  else if (d.all) { const el = $('#send-' + d.all); el.value = S.units[d.all]; }
  else if (d.send !== undefined) { const vi = +d.send, units = {}; let n = 0; UK.forEach(k => { const q = Math.max(0, Math.min(S.units[k], parseInt($('#send-' + k).value) || 0)); units[k] = q; n += q; });
    if (!n) return say('Göndermek için asker seç.', 'bad'); if (n > shipCap()) return say('Gemi kapasitesi ' + shipCap() + ' asker. Limanı yükselt.', 'bad'); closeModal(); startAttack(vi, units); }
  else if (d.act === 'close') closeModal(); else if (d.act === 'log') logMenu(); else if (d.act === 'skipcam') cine = null; else if (d.act === 'interact') interact();
  else if (d.act === 'newgame') { S = fresh(); save(); closeModal(); cine = null; Object.keys(battles).forEach(k => { scene.remove(battles[k].g); delete battles[k]; }); wallKey = -1; armyKey = ''; say('Yeni krallık kuruldu.'); }
});
let uiAcc = 0, promptTxt = '';
function renderHUD() {
  const r = rates(); $('#res').innerHTML = RES.map(k => `<div class="r"><i class="dot ${k}"></i>${fmt(S.res[k])}<small>${r[k] >= 0 ? '+' : ''}${r[k].toFixed(1)}</small></div>`).join('') + `<div class="r">Nüfus ${popUsed()}/${popCap()}</div>`;
  $('#clock').textContent = 'Gün ' + (1 + Math.floor(S.t / 300)) + ' · ' + clock(S.t);
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === speed));
  $('#units').innerHTML = `<b>Ordu</b>` + UK.map(k => `<span>${UNIT[k].n}: ${S.units[k]}</span>`).join('') + (S.marches.length ? `<span style="color:var(--accent)">Seferde: ${marchCount()}</span>` : '') + `<span style="color:var(--mute)">Fethedilen: ${S.v.filter(v => v.conq).length}/5</span>`;
  const pl = $('#prompt'), i = (!cine && !menuOpen) ? nearestPlot() : -1;
  if (i < 0) pl.style.display = 'none'; else { const b = S.b[i], p = PLOTS[i]; let txt = !b ? (p.k === 'port' ? 'Liman kur' : 'İnşa et') : b.until ? `${BLD[b.t].n} inşa ediliyor %${Math.round(100 - (b.until - S.t) / buildTime(b.to - 1) * 100)}` : `${BLD[b.t].n} · seviye ${b.l}`;
    pl.innerHTML = `<kbd>E</kbd>${txt}`; pl.style.display = 'block'; }
}
let menuAcc = 0;
function drawMini() {
  const c = $('#mini'), x = c.getContext('2d'), W = c.width, sc = W / 2 / 290; x.clearRect(0, 0, W, W); x.save(); x.beginPath(); x.arc(W / 2, W / 2, W / 2, 0, TAU); x.clip(); x.fillStyle = '#0d3b5a'; x.fillRect(0, 0, W, W);
  const P = (px, pz) => [W / 2 + px * sc, W / 2 + pz * sc - 60];
  const isl = (px, pz, r, col) => { const [a, b] = P(px, pz); x.fillStyle = col; x.beginPath(); x.arc(a, b, Math.max(4, r * sc), 0, TAU); x.fill(); };
  isl(0, 0, HOME_R, '#6fae45'); ISL.forEach((s, i) => isl(s.pos.x, s.pos.z, s.r, S.v[i].conq ? '#4f8df0' : '#c24a3a'));
  for (const k in shipsVis) { const [a, b] = P(shipsVis[k].position.x, shipsVis[k].position.z); x.fillStyle = k[0] === 'm' ? '#fff' : '#ffb347'; x.beginPath(); x.arc(a, b, 5, 0, TAU); x.fill(); }
  const [hx, hy] = P(heroS.x, heroS.z); x.fillStyle = '#ffe27a'; x.beginPath(); x.arc(hx, hy, 5, 0, TAU); x.fill(); x.restore();
}

// ================= DÖNGÜ =================
S = load(); let last = performance.now(), saveAcc = 0, miniAcc = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; perf += dt;
  tick(dt * speed);
  updateHero(dt); updateCitizens(dt * speed); syncBuildings(perf); syncWall(); syncCitizens(); syncArmy(); syncEnemies(); syncShips(); updateBattles(); updateCamera(dt);
  foams.forEach((f, i) => { const s = 1 + Math.sin(perf * 1.2 + i) * 0.015; f.m.scale.setScalar(s); f.m.material.opacity = 0.35 + 0.2 * Math.sin(perf * 1.5 + i); });
  menuAcc += dt; if (curMenu && menuAcc > 1) { menuAcc = 0; curMenu(); } uiAcc += dt; if (uiAcc > 0.2) { uiAcc = 0; renderHUD(); } miniAcc += dt; if (miniAcc > 0.1) { miniAcc = 0; drawMini(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg = { get S() { return S; }, hero: heroS, set speed(v) { speed = v; } };
</script>
